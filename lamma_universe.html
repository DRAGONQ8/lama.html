<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="لَمّة 7: 34 لعبة عربية تفاعلية، تحكم مريح للجوال، تلميحات منطقية، تدريب ومراجعة ومنافسات جماعية. تعمل دون إنترنت وتحفظ تقدمك."
    />
    <title>لَمّة 7 — كل جولة لها حكاية</title>
    <style>
      :root {
  color-scheme: dark;
  --bg: #101725;
  --surface: #192334;
  --raised: #202d40;
  --line: #354157;
  --ink: #f6f2e8;
  --muted: #b2bed0;
  --mint: #acebc7;
  --orange: #ffc38e;
  --pink: #eab6e8;
  --blue: #b5ceff;
  --red: #ffc0bc;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Tahoma, Arial, system-ui, sans-serif;
  line-height: 1.6;
}
button,
input,
select {
  font: inherit;
}
button {
  cursor: pointer;
  touch-action: manipulation;
}
button,
input,
select {
  border-radius: 14px;
  border: 1px solid var(--line);
}
button {
  min-height: 48px;
  padding: 10px 16px;
  background: var(--raised);
  color: var(--ink);
  font-weight: 700;
}
button:hover {
  filter: brightness(1.08);
}
button:disabled {
  opacity: 0.4;
  cursor: default;
  filter: none;
}
button:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--orange);
  outline-offset: 4px;
}
input,
select {
  width: 100%;
  background: var(--bg);
  color: var(--ink);
  padding: 12px;
  min-height: 48px;
}
input[type='checkbox'] {
  width: 22px;
  min-height: 22px;
  accent-color: var(--mint);
}
label {
  display: block;
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 8px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: clamp(30px, 6vw, 50px);
  line-height: 1.25;
}
h2 {
  font-size: 25px;
  line-height: 1.5;
}
h3 {
  font-size: 18px;
}
small,
.muted {
  color: var(--muted);
}
small {
  font-size: 13px;
}
a {
  color: var(--mint);
}
[hidden] {
  display: none !important;
}
.shell {
  max-width: 1060px;
  margin: auto;
  padding: 20px 20px calc(35px + env(safe-area-inset-bottom));
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 0;
  background: transparent;
  padding: 0;
}
.brandmark {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--mint);
  color: #142923;
  font-size: 25px;
}
.brandtext {
  font-size: 25px;
  letter-spacing: -1px;
}
.topactions {
  display: flex;
  gap: 8px;
}
.iconbtn {
  padding: 9px 12px;
  font-size: 14px;
}
.hero {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 28px;
  background: linear-gradient(125deg, #1f3042, #202437);
  padding: 32px;
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  gap: 26px;
}
.hero .copy {
  max-width: 570px;
  position: relative;
  z-index: 1;
}
.eyebrow {
  color: var(--mint);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 12px;
}
.hero p {
  color: #c6d0df;
  margin-top: 13px;
  max-width: 480px;
}
.heromark {
  margin-right: auto;
  min-width: 160px;
  width: 180px;
  height: 180px;
  position: relative;
  display: grid;
  place-items: center;
}
.orbit {
  position: absolute;
  width: 160px;
  height: 160px;
  border: 1px dashed #617087;
  border-radius: 50%;
  transform: rotate(-20deg);
}
.orb {
  width: 110px;
  height: 110px;
  display: grid;
  place-items: center;
  border-radius: 32px;
  background: var(--mint);
  color: #17342b;
  font-weight: 900;
  font-size: 80px;
  transform: rotate(12deg);
  box-shadow: 12px 12px 0 #0f1c2c;
}
.bubble {
  position: absolute;
  border-radius: 14px;
  background: var(--orange);
  color: #4a2b10;
  width: 45px;
  height: 45px;
  display: grid;
  place-items: center;
  font-size: 22px;
  font-weight: bold;
  right: -8px;
  top: 3px;
}
.bubble.two {
  background: var(--pink);
  right: auto;
  left: 0;
  top: auto;
  bottom: 5px;
  transform: rotate(-12deg);
}
.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 20px;
}
.chip {
  border: 1px solid #49576b;
  color: #e2e8ef;
  border-radius: 50px;
  padding: 5px 11px;
  font-size: 12px;
}
.sectionhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 26px 0 14px;
}
.filter {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 14px 0;
}
.filter button {
  min-height: 40px;
  padding: 6px 15px;
  border-radius: 30px;
  font-size: 14px;
}
.filter .active {
  background: var(--mint);
  color: #132b24;
  border-color: var(--mint);
}
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.gamecard {
  padding: 19px;
  text-align: right;
  border-radius: 21px;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-height: 220px;
  gap: 12px;
  transition:
    transform 0.16s,
    border-color 0.16s;
}
.gamecard:hover {
  transform: translateY(-3px);
  border-color: var(--mint);
}
.tileicon {
  display: grid;
  place-items: center;
  width: 51px;
  height: 51px;
  border-radius: 15px;
  background: var(--tile, #b5ceff);
  font-size: 28px;
}
.gamecard p {
  font-size: 13px;
  color: var(--muted);
  font-weight: 400;
  line-height: 1.7;
}
.tagline {
  display: flex;
  gap: 8px;
  align-items: center;
  width: 100%;
  margin-top: auto;
  font-weight: 400;
  color: var(--muted);
  font-size: 11px;
}
.tagline b {
  color: var(--mint);
  margin-right: auto;
  font-size: 17px;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 24px;
  margin-top: 14px;
}
.play {
  max-width: 720px;
  margin: auto;
}
.playhead {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}
.playhead .tileicon {
  flex-shrink: 0;
}
.playhead p {
  font-size: 14px;
  color: var(--muted);
}
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 18px;
}
.field {
  min-width: 0;
}
.field.full {
  grid-column: 1/-1;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.row > * {
  flex: 1;
}
.row .shrink {
  flex: 0 0 auto;
}
.actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
  flex-wrap: wrap;
}
.actions > * {
  flex: 1;
}
.primary {
  background: var(--mint);
  color: #112d21;
  border-color: var(--mint);
}
.warm {
  background: var(--orange);
  color: #412c18;
  border-color: var(--orange);
}
.rose {
  background: var(--pink);
  color: #38203a;
  border-color: var(--pink);
}
.softred {
  background: #452b36;
  color: var(--red);
  border-color: #67404d;
}
.quiet {
  background: transparent;
}
.note {
  color: var(--muted);
  font-size: 13px;
  margin: 14px 0 0;
  line-height: 1.85;
}
.stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.stat {
  flex: 1;
  min-width: 100px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 14px;
  text-align: center;
  padding: 11px;
}
.stat b {
  display: block;
  color: var(--mint);
  font-size: 21px;
}
.stat small {
  font-size: 12px;
}
.spot {
  padding: 28px 14px;
  text-align: center;
  border-radius: 22px;
  background: var(--bg);
  border: 1px solid var(--line);
  margin: 14px 0;
}
.spot .huge {
  font-size: clamp(32px, 8vw, 53px);
  font-weight: 900;
  line-height: 1.35;
  margin: 14px 0;
  color: var(--mint);
  overflow-wrap: anywhere;
  direction: ltr;
  unicode-bidi: isolate;
}
.spot .word {
  font-size: clamp(30px, 6vw, 42px);
  direction: rtl;
}
.range {
  direction: ltr;
  unicode-bidi: isolate;
  overflow-wrap: anywhere;
  font-size: 14px;
  color: var(--muted);
  margin-top: 10px;
}
.bar {
  height: 6px;
  background: var(--raised);
  border-radius: 4px;
  overflow: hidden;
}
.bar span {
  display: block;
  height: 100%;
  background: var(--mint);
  transition: width 0.2s;
}
.answerrow {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}
.answerrow button {
  padding: 14px 7px;
  line-height: 1.5;
}
.answerrow small {
  display: block;
  font-weight: 400;
  color: inherit;
  font-size: 11px;
}
.history {
  margin-top: 17px;
  font-size: 13px;
}
.history summary {
  cursor: pointer;
  color: var(--muted);
  padding: 10px;
}
.history ol {
  margin: 6px 0;
  padding-right: 23px;
  color: var(--muted);
}
.hint {
  background: var(--bg);
  border-right: 3px solid var(--orange);
  padding: 14px;
  border-radius: 12px;
  margin: 12px 0;
}
.hint b {
  color: var(--orange);
  font-size: 12px;
  display: block;
  margin-bottom: 5px;
}
.success {
  border-color: #629579;
  background: linear-gradient(145deg, #253f36, #1b2934);
}
.center {
  text-align: center;
}
.resulticon {
  font-size: 54px;
  margin-bottom: 10px;
}
.resultnum {
  font-size: 32px;
  font-weight: bold;
  color: var(--mint);
  overflow-wrap: anywhere;
  direction: ltr;
  unicode-bidi: isolate;
}
.listchips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  padding: 10px 0;
}
.listchips span {
  font-size: 13px;
  border: 1px solid var(--line);
  border-radius: 30px;
  padding: 5px 11px;
}
.board {
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.boardrow {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--bg);
  border-radius: 14px;
}
.boardrow .rank {
  color: var(--muted);
  width: 26px;
}
.boardrow .score {
  margin-right: auto;
  color: var(--mint);
  font-size: 22px;
  font-weight: bold;
}
.name {
  overflow-wrap: anywhere;
}
.boardrow small {
  display: block;
}
.foot {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin: 27px 0 0;
}
.modalback {
  position: fixed;
  inset: 0;
  background: #080d18ce;
  z-index: 15;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 23px;
  width: min(600px, 100%);
  max-height: 90vh;
  max-height: 90dvh;
  overflow: auto;
}
.modalhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}
.names {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 17px;
}
.check {
  display: flex;
  align-items: center;
  gap: 10px;
}
.check label {
  margin: 0;
}
.toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  border: 1px solid var(--orange);
  background: #293245;
  color: var(--ink);
  box-shadow: 0 5px 30px #0008;
  padding: 13px 18px;
  border-radius: 16px;
  max-width: calc(100% - 30px);
  width: max-content;
  font-size: 14px;
  pointer-events: none;
}
.memory {
  display: grid;
  gap: 10px;
  margin: 18px 0;
}
.memcard {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  font-size: clamp(25px, 6vw, 40px);
  padding: 0;
  min-height: 0;
  border-radius: 14px;
  background: var(--raised);
}
.memcard.up {
  background: var(--blue);
  color: #18304e;
}
.memcard.matched {
  background: #294739;
  border-color: #6a9a7f;
}
.reaction {
  width: 100%;
  min-height: 220px;
  border-radius: 23px;
  font-size: 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: #293447;
}
.reaction.waiting {
  background: #634237;
}
.reaction.ready {
  background: var(--mint);
  color: #153325;
}
.reaction small {
  color: inherit;
  font-size: 15px;
  font-weight: 400;
}
.countdown {
  font-size: 42px;
  font-weight: bold;
  color: var(--orange);
}
.secret {
  font-size: 38px;
  line-height: 1.5;
  color: var(--orange);
  overflow-wrap: anywhere;
  filter: none;
}
.timerline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 12px 0;
}
.solofooter {
  margin: 20px 0;
}
.pill {
  background: var(--raised);
  border: 1px solid var(--line);
  padding: 4px 12px;
  border-radius: 30px;
  color: var(--muted);
  font-size: 12px;
}
.celebrate {
  animation: pop 0.35s ease-out;
}
.scroll {
  overflow-x: auto;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
@keyframes pop {
  from {
    transform: scale(0.96);
    opacity: 0.6;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}
@media (max-width: 850px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (max-width: 520px) {
  .shell {
    padding: 14px 14px calc(25px + env(safe-area-inset-bottom));
  }
  .hero {
    padding: 23px;
    min-height: 220px;
  }
  .heromark {
    display: none;
  }
  .top {
    margin-bottom: 16px;
  }
  .topactions {
    gap: 5px;
  }
  .iconbtn {
    font-size: 12px;
    padding: 8px 10px;
  }
  .brandtext {
    font-size: 23px;
  }
  .grid {
    gap: 10px;
  }
  .gamecard {
    padding: 15px;
    min-height: 218px;
  }
  .panel {
    padding: 18px;
  }
  .fields {
    gap: 12px;
  }
  .answerrow {
    gap: 7px;
  }
  .answerrow button {
    font-size: 14px;
  }
  .names {
    grid-template-columns: 1fr;
  }
  .playhead h2 {
    font-size: 23px;
  }
  .spot {
    padding: 22px 12px;
  }
}
@media (max-width: 380px) {
  .brandtext {
    display: none;
  }
  .hero {
    padding: 20px;
  }
  .gamecard {
    padding: 12px;
  }
  .topactions .iconbtn {
    padding: 8px 9px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *:before,
  *:after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

:root {
  --bg: #0b1020;
  --surface: #141c30;
  --raised: #1e2942;
  --line: #2b3956;
  --ink: #f5f7fc;
  --muted: #a6b4cb;
  --mint: #77ecd1;
  --orange: #ffcc86;
  --pink: #d6b6ff;
  --blue: #a4c9ff;
  --shadow: 0 18px 65px #0003;
}
html {
  scroll-behavior: smooth;
  scroll-padding-top: 20px;
}
body {
  background:
    radial-gradient(ellipse at 10% 0, #18334766, transparent 38%),
    radial-gradient(ellipse at 98% 18%, #37265c55, transparent 40%), var(--bg);
  min-height: 100vh;
  font-family: Tahoma, Arial, system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}
button {
  transition:
    background 0.15s,
    transform 0.15s;
}
button:active {
  transform: scale(0.975);
}
.shell {
  max-width: 1180px;
  padding-bottom: 105px;
}
.brandtext {
  line-height: 1.15;
}
.brandtext small {
  display: block;
  font-size: 10px;
  letter-spacing: 0;
  margin-top: 6px;
  color: var(--muted);
}
.brandmark {
  background: linear-gradient(140deg, #88f8da, #66cfff);
  box-shadow: 0 0 24px #77ecd120;
}
.top {
  border-bottom: 1px solid var(--line);
  padding-bottom: 19px;
}
.hero {
  padding: 34px;
  border-radius: 28px;
  background:
    radial-gradient(ellipse at 12% 30%, #3c387780, transparent 65%),
    linear-gradient(115deg, #163549, #18263c 55%, #211f3f);
  box-shadow: var(--shadow);
  min-height: 264px;
}
.hero .copy {
  max-width: 630px;
}
.hero h1 {
  font-size: clamp(34px, 5.1vw, 58px);
  letter-spacing: -1px;
}
.hero h1 em {
  font-style: normal;
  color: var(--mint);
}
.hero p {
  max-width: 550px;
}
.hero .actions {
  max-width: 360px;
}
.hero-art {
  width: 250px;
  min-width: 210px;
  height: 230px;
  position: relative;
  margin-right: auto;
  display: grid;
  place-items: center;
}
.planet {
  width: 168px;
  height: 168px;
  border-radius: 50%;
  background: radial-gradient(circle at 33% 25%, #75f4da, #279e98 55%, #236e84);
  box-shadow:
    inset -15px -10px 30px #122c6466,
    0 0 55px #63edd225;
  display: grid;
  place-items: center;
  font-size: 66px;
  transform: rotate(-10deg);
}
.planet:after {
  content: '';
  position: absolute;
  width: 210px;
  height: 60px;
  border: 3px solid #b0d6ff88;
  border-radius: 50%;
  transform: rotate(24deg);
}
.satellite {
  position: absolute;
  font-size: 33px;
  border: 1px solid #6b799755;
  background: #27344bd0;
  border-radius: 20px;
  width: 65px;
  height: 65px;
  display: grid;
  place-items: center;
  box-shadow: 0 8px 20px #0003;
  z-index: 2;
}
.satellite.a {
  top: 5px;
  right: 0;
  transform: rotate(12deg);
}
.satellite.b {
  bottom: 0;
  left: 5px;
  transform: rotate(-12deg);
}
.satellite.c {
  top: 15px;
  left: 0;
  font-size: 25px;
  width: 50px;
  height: 50px;
}
.dashboard {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 18px 0;
}
.dash {
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
  min-width: 0;
}
.dash .symbol {
  font-size: 25px;
}
.dash b {
  display: block;
  font-size: 20px;
  color: var(--ink);
}
.dash small {
  display: block;
}
.worldtabs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 9px;
  margin-top: 16px;
}
.worldtab {
  min-height: 78px;
  padding: 12px 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 4px;
  border-radius: 17px;
  background: var(--surface);
  font-size: 12px;
}
.worldtab span {
  font-size: 24px;
}
.worldtab.active {
  border-color: var(--mint);
  box-shadow: inset 0 -2px var(--mint);
  color: var(--mint);
}
.catalogbar {
  display: flex;
  gap: 12px;
  align-items: center;
  margin: 20px 0 10px;
  flex-wrap: wrap;
}
.catalogbar .filter {
  margin: 0;
}
.searchwrap {
  flex: 1;
  min-width: 160px;
  position: relative;
}
.searchwrap input {
  border-radius: 30px;
  padding-right: 18px;
}
.grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}
.gamecard {
  position: relative;
  min-width: 0;
  min-height: 235px;
  padding: 0;
  display: block;
  overflow: hidden;
  background: linear-gradient(145deg, var(--surface), #182038);
  border: 1px solid var(--line);
}
.cardstart {
  border: 0;
  background: transparent;
  width: 100%;
  min-height: 235px;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: right;
  padding: 19px;
  gap: 12px;
}
.cardstart h3 {
  font-size: 18px;
}
.cardstart .tileicon {
  background: color-mix(in srgb, var(--tile), #182235 78%);
  border: 1px solid color-mix(in srgb, var(--tile), transparent 65%);
}
.cardstart .tagline {
  font-size: 11px;
}
.fav {
  position: absolute;
  top: 13px;
  left: 11px;
  min-height: 32px;
  width: 32px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--raised);
  font-size: 20px;
  z-index: 2;
  color: var(--muted);
}
.fav.on {
  color: var(--orange);
}
.gamecard:before {
  content: '';
  position: absolute;
  height: 3px;
  right: 17px;
  left: 17px;
  bottom: 0;
  background: var(--tile);
  opacity: 0.65;
}
.panel {
  box-shadow: 0 5px 30px #0001;
}
.play {
  max-width: 800px;
}
.playhead h2 {
  font-size: 26px;
}
.playhead .tileicon {
  background: color-mix(in srgb, var(--tile), #192539 75%);
}
.playhead .quiet {
  min-width: 48px;
}
.dock {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: min(460px, calc(100% - 28px));
  display: flex;
  z-index: 9;
  border: 1px solid #51647b;
  background: #1a2538f5;
  box-shadow: 0 8px 35px #0007;
  border-radius: 23px;
  padding: 6px 12px;
  backdrop-filter: blur(20px);
}
.dock button {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 3px;
  min-height: 50px;
  font-size: 20px;
}
.dock button span {
  display: block;
  font-size: 10px;
  color: #c3cfe2;
  margin-top: 1px;
}
.toast {
  bottom: 95px;
}
.world-label {
  font-size: 12px;
  display: block;
  color: var(--mint);
  margin-bottom: 6px;
}
.progressline {
  height: 7px;
  background: var(--raised);
  border-radius: 9px;
  overflow: hidden;
  margin: 12px 0;
}
.progressline > span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--mint));
}
.twochoices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 14px 0;
}
.choice {
  padding: 18px;
  border-radius: 18px;
  text-align: right;
  background: var(--bg);
}
.choice b,
.choice small {
  display: block;
}
.choice .symbol {
  font-size: 28px;
  display: block;
  margin-bottom: 9px;
}
.tiny {
  font-size: 12px;
  color: var(--muted);
}
.badgegrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
.badge {
  padding: 14px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 16px;
  opacity: 0.48;
}
.badge.earned {
  opacity: 1;
  border-color: #5b9285;
}
.badge span {
  font-size: 25px;
}
.badge b {
  display: block;
  font-size: 14px;
  margin-top: 6px;
}
.badge small {
  display: block;
  font-size: 11px;
}
.modal {
  width: min(680px, 100%);
}
.settingsrow {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.settingsrow .primarytext {
  flex: 1;
}
.settingsrow b,
.settingsrow small {
  display: block;
}
.settingsrow button {
  min-width: 82px;
}
.legend {
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  margin: 16px 0;
  font-size: 13px;
}
.turnmark {
  background: var(--raised);
  padding: 8px 14px;
  border-radius: 13px;
  text-align: center;
  margin: 13px 0;
  color: var(--mint);
}
.ttt {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 360px;
  margin: 22px auto;
  direction: ltr;
}
.ttt button {
  aspect-ratio: 1;
  font-size: 48px;
  padding: 0;
  min-height: 70px;
  background: var(--bg);
  border-width: 2px;
}
.ttt .p1 {
  color: var(--mint);
}
.ttt .p2 {
  color: var(--orange);
}
.ttt .win {
  background: #2f6257;
  border-color: var(--mint);
}
.connect {
  direction: ltr;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  border: 1px solid var(--line);
  background: #273458;
  padding: 12px;
  border-radius: 18px;
  max-width: 530px;
  margin: 16px auto;
}
.drop {
  min-height: 44px;
  padding: 0;
  border-radius: 10px;
  color: var(--mint);
  background: #172238;
}
.disc {
  aspect-ratio: 1;
  border-radius: 50%;
  background: #11182c;
  border: 2px solid #465373;
  display: grid;
  place-items: center;
  font-size: 14px;
  color: var(--muted);
}
.disc.red {
  background: #ff9083;
  box-shadow: inset 0 -4px #c26871;
}
.disc.yellow {
  background: #ffd16f;
  box-shadow: inset 0 -4px #d49d3f;
}
.disc.win {
  outline: 3px solid white;
  outline-offset: -5px;
}
.codeentry {
  display: flex;
  justify-content: center;
  gap: 7px;
  margin: 18px 0;
}
.codeentry select {
  width: min(68px, 22%);
  font-size: 26px;
  text-align: center;
  padding: 8px;
  direction: ltr;
  background: var(--bg);
}
.codehistory {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.codeline {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px;
  background: var(--bg);
}
.codeline .digits {
  letter-spacing: 7px;
  font-size: 24px;
  font-weight: bold;
  color: var(--ink);
  direction: ltr;
}
.codeline .feedback {
  margin-right: auto;
  font-size: 12px;
}
.codeline small {
  color: var(--muted);
}
.sequencepad {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  max-width: 390px;
  margin: 22px auto;
  direction: ltr;
}
.sequencepad button {
  aspect-ratio: 1.2;
  min-height: 100px;
  font-size: 32px;
  border-radius: 22px;
  background: color-mix(in srgb, var(--pad), #11182d 65%);
  border: 2px solid color-mix(in srgb, var(--pad), #11182d 40%);
  color: #fff;
  transition:
    filter 0.1s,
    box-shadow 0.1s;
}
.sequencepad button.lit {
  background: var(--pad);
  color: #071b28;
  box-shadow: 0 0 30px color-mix(in srgb, var(--pad), transparent 65%);
  transform: scale(0.97);
}
.puzzle {
  display: grid;
  gap: 8px;
  max-width: 390px;
  margin: 20px auto;
  direction: ltr;
}
.puzzle button {
  aspect-ratio: 1;
  min-height: 0;
  padding: 0;
  font-size: 26px;
  background: var(--raised);
  border: 1px solid var(--line);
}
.puzzle .empty {
  opacity: 0;
  cursor: default;
}
.puzzle .correct {
  border-color: #567c77;
  color: var(--mint);
}
.sudoku {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  max-width: 468px;
  margin: 18px auto;
  direction: ltr;
  border: 2px solid #8297b1;
  overflow: hidden;
  border-radius: 6px;
}
.sudoku button {
  aspect-ratio: 1;
  min-height: 0;
  padding: 0;
  font-size: 21px;
  border-radius: 0;
  border: 0;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  font-weight: 400;
  color: var(--mint);
}
.sudoku button.given {
  color: var(--ink);
  font-weight: bold;
  background: var(--surface);
}
.sudoku button.rightborder {
  border-right: 2px solid #8297b1;
}
.sudoku button.bottomborder {
  border-bottom: 2px solid #8297b1;
}
.sudoku button.selected {
  background: #35536e;
}
.sudoku button.related {
  background: #1d3147;
}
.sudoku button.conflict {
  color: #ffaba7;
  background: #542c40;
}
.numberpad {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 5px;
  direction: ltr;
  margin-top: 14px;
}
.numberpad button {
  padding: 0;
  min-height: 44px;
  font-size: 21px;
}
.scramble {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 24px 0;
}
.letter {
  min-width: 45px;
  padding: 8px 10px;
  background: var(--raised);
  border: 1px solid #56778b;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 28px;
  color: var(--mint);
}
.quizanswers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
  margin: 20px 0;
}
.quizanswers button {
  min-height: 75px;
  font-size: 22px;
  background: var(--raised);
}
.quizanswers button.correct {
  border-color: var(--mint);
  background: #265348;
}
.quizanswers button.wrong {
  border-color: #ff9294;
  background: #523240;
}
.quizquestion {
  padding: 30px 16px;
  font-size: 40px;
  line-height: 1.4;
  text-align: center;
  font-weight: bold;
  direction: ltr;
  background: var(--bg);
  border-radius: 22px;
  overflow-wrap: anywhere;
}
.inkword {
  font-size: 56px;
  text-align: center;
  margin: 24px 0;
  font-weight: bold;
  text-shadow: 0 1px #0003;
}
.chain {
  display: flex;
  gap: 8px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  direction: ltr;
}
.chain span {
  font-size: 26px;
  min-width: 48px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 5px;
  text-align: center;
}
.chain .missing {
  color: var(--orange);
  border-style: dashed;
}
.secretcover {
  padding: 35px 14px;
  text-align: center;
  background: var(--bg);
  border: 1px dashed #73869c;
  border-radius: 20px;
  margin: 18px 0;
}
.secretcover .symbol {
  font-size: 55px;
}
.secretcover h3 {
  margin: 10px 0;
}
.forbidden {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 15px 0;
}
.forbidden span {
  border: 1px solid #815464;
  border-radius: 20px;
  padding: 6px 14px;
  color: var(--red);
  background: #492c3a;
}
.roundrow {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg);
  border-radius: 13px;
  padding: 13px;
  margin: 8px 0;
}
.roundrow b {
  flex: 1;
}
.roundrow .pill {
  white-space: nowrap;
}
.sessionbanner {
  margin: 12px 0;
  padding: 12px;
  border: 1px solid #87764c;
  border-radius: 15px;
  background: #393226;
  color: #ffe7b7;
  font-size: 13px;
  text-align: center;
}
.emptylist {
  text-align: center;
  padding: 40px;
  color: var(--muted);
  grid-column: 1/-1;
}
.knowledge {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  max-height: 320px;
  overflow: auto;
  margin: 15px 0;
}
.knowledge .check {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  align-items: flex-start;
}
.knowledge label {
  font-size: 12px;
}
.knowledge input {
  flex-shrink: 0;
}
textarea {
  font: inherit;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 14px;
  padding: 13px;
  width: 100%;
  resize: vertical;
  min-height: 90px;
}
.listword {
  display: flex;
  gap: 9px;
  align-items: center;
  padding: 10px;
  background: var(--bg);
  border-radius: 12px;
  margin: 6px 0;
}
.listword b {
  flex: 1;
}
.listword button {
  padding: 5px 12px;
  min-height: 36px;
}
.inlinecheck {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
}
.inlinecheck label {
  margin: 0;
}
.hintpanel {
  border: 1px dashed #647c8c;
  padding: 15px;
  border-radius: 14px;
  margin-top: 15px;
  color: var(--muted);
  font-size: 13px;
}
.pausecover {
  position: fixed;
  inset: 0;
  z-index: 25;
  display: grid;
  place-items: center;
  background: #080f21e8;
  backdrop-filter: blur(18px);
  padding: 20px;
}
.pausebox {
  text-align: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 26px;
  padding: 34px;
  max-width: 420px;
  width: 100%;
}
.pausebox h2 {
  margin: 15px 0;
}
.pausebox button {
  width: 100%;
  margin-top: 16px;
}
body[data-theme='light'] {
  color-scheme: light;
  --bg: #edf2f8;
  --surface: #fff;
  --raised: #e2eaf5;
  --line: #cad6e7;
  --ink: #15273c;
  --muted: #536b83;
  --mint: #128674;
  --orange: #925807;
  --pink: #7245b0;
  --blue: #315e9d;
  background: #edf2f8;
}
body[data-theme='light'] .hero {
  background: linear-gradient(110deg, #dbf3ec, #e4eafa);
  color: #162b42;
}
body[data-theme='light'] .hero p {
  color: #3f6376;
}
body[data-theme='light'] .hero h1 em {
  color: #137969;
}
body[data-theme='light'] .gamecard {
  background: #fff;
}
body[data-theme='light'] .success {
  background: linear-gradient(145deg, #dff4ec, #e9f4ff);
  border-color: #82b6a3;
}
body[data-theme='light'] .chip {
  color: #325164;
  border-color: #9cbab8;
}
body[data-theme='light'] .sudoku button.related {
  background: #e0ebf5;
}
body[data-theme='light'] .sudoku button.selected {
  background: #b5d4e9;
}
body[data-theme='light'] .quizanswers .correct {
  background: #c8eedc;
}
body[data-theme='light'] .quizanswers .wrong {
  background: #f6d8df;
}
body[data-theme='light'] .ttt .win {
  background: #b4edcf;
}
body[data-theme='light'] .sessionbanner {
  background: #fff2d6;
  color: #664c16;
}
body[data-theme='light'] .forbidden span {
  background: #fde5ea;
  color: #884451;
}
body[data-theme='light'] .toast {
  background: #fff;
  color: #15273c;
}
.topactions .iconbtn {
  white-space: nowrap;
}
.topactions {
  align-items: center;
}
.names {
  grid-template-columns: 1fr 1fr 1fr;
}
.memcard.matched {
  opacity: 0.8;
}
.memcard:disabled {
  opacity: 0.8;
}
.dock button:focus-visible {
  outline-offset: 0;
}
.foot {
  margin-bottom: 10px;
}
.progressline span {
  min-width: 0;
}
.check input {
  flex-shrink: 0;
}
.countdown {
  direction: ltr;
  unicode-bidi: isolate;
}
.spot .secret {
  direction: rtl;
}
.reaction {
  touch-action: manipulation;
}
.digit {
  direction: ltr;
  unicode-bidi: isolate;
}
.resultnum {
  direction: inherit;
  unicode-bidi: plaintext;
}
@media (max-width: 980px) {
  .grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
@media (max-width: 700px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .hero-art {
    min-width: 140px;
    width: 170px;
    transform: scale(0.78);
  }
  .hero {
    padding: 26px;
  }
  .dash {
    padding: 13px 10px;
    gap: 8px;
  }
  .dash .symbol {
    font-size: 22px;
  }
  .dash b {
    font-size: 17px;
  }
  .dash small {
    font-size: 11px;
  }
  .worldtab {
    font-size: 11px;
  }
  .names {
    grid-template-columns: 1fr 1fr;
  }
}
@media (max-width: 520px) {
  .shell {
    padding: 14px 13px 100px;
  }
  .top {
    gap: 8px;
  }
  .topactions .iconbtn {
    font-size: 12px;
    padding: 7px 9px;
  }
  .topactions .iconbtn span {
    display: none;
  }
  .hero {
    padding: 25px;
    min-height: 275px;
  }
  .hero-art {
    display: none;
  }
  .hero p {
    font-size: 14px;
  }
  .hero h1 {
    font-size: 39px;
  }
  .hero .actions {
    margin-top: 22px;
  }
  .dashboard {
    gap: 7px;
  }
  .dash {
    flex-direction: column;
    align-items: flex-start;
    padding: 12px;
    gap: 5px;
  }
  .dash small {
    font-size: 10px;
  }
  .dash b {
    font-size: 19px;
  }
  .worldtabs {
    gap: 5px;
  }
  .worldtab {
    padding: 8px 4px;
    min-height: 73px;
    font-size: 10px;
  }
  .worldtab span {
    font-size: 23px;
  }
  .grid {
    gap: 11px;
  }
  .cardstart {
    padding: 16px 13px;
    min-height: 235px;
  }
  .cardstart h3 {
    font-size: 16px;
  }
  .cardstart p {
    font-size: 12px;
  }
  .cardstart .tileicon {
    width: 45px;
    height: 45px;
    font-size: 26px;
  }
  .fav {
    top: 13px;
    left: 9px;
    width: 30px;
    font-size: 18px;
  }
  .catalogbar .filter {
    gap: 5px;
  }
  .filter button {
    padding: 6px 12px;
    font-size: 12px;
  }
  .playhead h2 {
    font-size: 23px;
  }
  .playhead {
    gap: 10px;
  }
  .panel {
    padding: 18px;
  }
  .quizquestion {
    font-size: 32px;
  }
  .quizanswers button {
    font-size: 20px;
    min-height: 65px;
  }
  .numberpad {
    gap: 3px;
  }
  .numberpad button {
    font-size: 18px;
    min-height: 39px;
  }
  .sudoku button {
    font-size: 18px;
  }
  .connect {
    padding: 8px;
    gap: 4px;
  }
  .knowledge {
    grid-template-columns: 1fr;
  }
  .modalback {
    padding: 12px;
  }
  .modal {
    padding: 19px;
  }
  .ttt button {
    font-size: 43px;
  }
  .chain span {
    font-size: 23px;
    min-width: 41px;
  }
  .dash .symbol {
    font-size: 22px;
  }
  .legend {
    font-size: 12px;
    gap: 10px;
  }
  .dock {
    bottom: max(10px, env(safe-area-inset-bottom));
  }
  .badgegrid {
    gap: 8px;
  }
}
@media (max-width: 360px) {
  .brandtext {
    display: block;
    font-size: 21px;
  }
  .brandtext small {
    display: none;
  }
  .topactions .iconbtn {
    padding: 7px;
    min-width: 35px;
  }
  .hero h1 {
    font-size: 33px;
  }
  .cardstart {
    padding: 14px 11px;
  }
  .worldtab {
    font-size: 9px;
  }
  .worldtab span {
    font-size: 21px;
  }
  .names {
    grid-template-columns: 1fr;
  }
  .sudoku button {
    font-size: 16px;

}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
}

.turnmark,
.stat b,
h2,
h3 {
  overflow-wrap: anywhere;
}
.names > div {
  min-width: 0;
}
@media (max-width: 360px) {
  .brandmark {
    width: 36px;
    height: 36px;
  }
  .brand {
    gap: 6px;
  }
  .brandtext {
    font-size: 20px;
  }
}

/* Expansive, responsive platform layout. */
html {
  min-height: 100%;
  scroll-padding-top: 96px;
}
body {
  min-height: 100vh;
  min-height: 100dvh;
}
body.overlay-open {
  overflow: hidden;
}
.shell {
  width: 100%;
  max-width: none;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 20px clamp(14px, 2.4vw, 64px) calc(108px + env(safe-area-inset-bottom));
}
.top {
  position: relative;
  gap: 18px;
  padding: 4px 0 22px;
  margin-bottom: 26px;
}
.brandmark {
  width: 46px;
  height: 46px;
  font-size: 29px;
  border-radius: 16px;
}
.brandtext {
  font-size: 29px;
}
.brandtext small {
  font-size: 11px;
  letter-spacing: 0.5px;
}
.topactions {
  gap: 8px;
}
.topactions .iconbtn {
  min-height: 44px;
  padding: 8px 13px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border-color: var(--line);
  background: color-mix(in srgb, var(--surface), transparent 8%);
}
#fullscreen {
  font-size: 20px;
}
#fullscreen span {
  font-size: 13px;
}
.hero {
  min-height: 330px;
  padding: clamp(28px, 3.5vw, 66px);
  margin-bottom: 24px;
  border-radius: 30px;
  isolation: isolate;
}
.hero:before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.28;
  background-image: radial-gradient(#accce8 1px, transparent 1px);
  background-size: 38px 38px;
  mask-image: linear-gradient(90deg, #000, transparent 70%);
}
.hero .copy {
  max-width: 750px;
}
.hero h1 {
  font-size: clamp(38px, 4.2vw, 74px);
  line-height: 1.2;
}
.hero p {
  font-size: clamp(14px, 1.25vw, 18px);
  max-width: 690px;
  line-height: 1.9;
  margin-top: 19px;
}
.hero .eyebrow {
  font-size: 14px;
  letter-spacing: 0;
}
.hero .actions {
  max-width: 430px;
  margin-top: 25px;
}
.hero .actions button {
  min-height: 52px;
}
.hero .chips {
  margin-top: 25px;
}
.hero-art {
  width: 33%;
  max-width: 430px;
  min-width: 260px;
  height: 280px;
  margin-inline-start: auto;
  margin-inline-end: 10px;
}
.planet {
  width: 210px;
  height: 210px;
  font-size: 82px;
  position: relative;
  animation: planetFloat 7s ease-in-out infinite;
}
.planet:after {
  width: 290px;
  height: 86px;
  border-width: 4px;
}
.orbit-track {
  position: absolute;
  inset: 10px 0;
  border: 1px dashed #789dc93b;
  border-radius: 50%;
  transform: rotate(-23deg);
}
.satellite {
  width: 76px;
  height: 76px;
  font-size: 38px;
  border-radius: 23px;
}
.satellite.a {
  top: 3px;
  right: 3%;
}
.satellite.b {
  bottom: 4px;
  left: 10%;
}
.satellite.c {
  top: 2px;
  left: 8%;
  width: 60px;
  height: 60px;
  font-size: 27px;
}
.hero-status {
  position: absolute;
  bottom: 8px;
  right: 2%;
  display: flex;
  align-items: center;
  gap: 8px;
  background: #0c1d2bc9;
  border: 1px solid #72cfaf66;
  border-radius: 40px;
  padding: 6px 13px;
  font-size: 12px;
  color: #b9efda;
}
.hero-status span {
  width: 7px;
  height: 7px;
  background: #77ecd1;
  border-radius: 50%;
  box-shadow: 0 0 12px #77ecd1;
}
@keyframes planetFloat {
  0%,
  100% {
    transform: translateY(0) rotate(-10deg);
  }
  50% {
    transform: translateY(-9px) rotate(-6deg);
  }
}
.dashboard {
  gap: 16px;
  margin: 22px 0;
}
.dash {
  padding: 20px 23px;
  text-align: right;
  gap: 17px;
}
.dash .symbol {
  width: 50px;
  height: 50px;
  background: var(--raised);
  border: 1px solid var(--line);

}
.dash b {

}
.dash small {

}
.dash-arrow {

}
.dash:hover {

}
.featured-grid {

}
.featured-card {

.recent-games {

.sectionhead {

.smallbtn {

.worldtabs {

.worldtab {

.catalogbar {

}
.catalogbar .filter {

}
.filter button {

}
.filter button span {

.searchwrap {

.catalogsummary {

}
.catalogsummary .tiny {

.grid {

.gamecard {

.stat {

.guide-step p {

.modal {

.modalhead h2 {

.modalhead button {

.tournament-choice {

.foot {

.skiplink {

/* Touch-friendly arcade surfaces; visual coordinates always remain left-to-right. */
#mazeStars,
#mineProgress,
#arcadeTime {
  direction: ltr;
  unicode-bidi: isolate;
}
.mines-board.mines-medium {
  min-width: 464px;
}
.mines-board.mines-large {
  min-width: 624px;
}
.arcade-panel {
  padding: 20px;
}
.arcade-stage {
  position: relative;
  max-width: 560px;
  margin: 0 auto;
  overflow: hidden;
  border-radius: 18px;
}
#snakeCanvas,
#mazeCanvas,
#mazeReplayCanvas {
  display: block;
  max-width: 560px;
  width: 100%;
  height: auto;
  margin: auto;
  border-radius: 18px;
  border: 1px solid var(--line);
  touch-action: none;
  user-select: none;
  direction: ltr;
}
.arcade-overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: #0b1525dc;
  z-index: 2;
  padding: 20px;
  backdrop-filter: blur(5px);
  text-align: center;
  color: #f6f2e8;
}
.arcade-overlay > div {
  max-width: 360px;
  width: 100%;
}
.arcade-overlay h3 {
  font-size: 24px;
}
.arcade-overlay p {
  font-size: 14px;
  margin: 10px 0 16px;
  color: #c3cedb;
}
.arcade-big-icon {
  font-size: 54px;
  display: block;
  margin-bottom: 8px;
}
.arcade-directions {
  direction: ltr;
  display: grid;
  grid-template-columns: repeat(3, 58px);
  grid-template-rows: repeat(2, 50px);
  gap: 7px;
  justify-content: center;
  margin: 16px auto;
  user-select: none;
}
.arcade-directions button {
  font: 800 28px/1 Arial;
  border-radius: 13px;
  padding: 0;
  min-height: 50px;
  touch-action: manipulation;
}
.dir-up {
  grid-area: 1/2;
}
.dir-left {
  grid-area: 2/1;
}
.dir-down {
  grid-area: 2/2;
}
.dir-right {
  grid-area: 2/3;
}
.arcade-status {
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  color: var(--mint);
  margin-top: 12px;
  min-height: 25px;
  line-height: 1.7;
}
.arcade-directions button:disabled {
  opacity: 0.45;
}
.arcade-directions button:active {
  transform: translateY(2px);
}
.arcade-extra-field {
  margin-top: 18px;
}
.arcade-coach {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 13px 16px;
  margin: 16px auto;
  max-width: 560px;
  background: var(--bg);
}
.arcade-coach summary {
  cursor: pointer;
  font-weight: 800;
  min-height: 32px;
  line-height: 1.8;
}
.merge-forecast-choices {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  direction: ltr;
  margin: 12px 0;
}
.merge-forecast-choices button {
  min-height: 44px;
  padding: 8px 4px;
  font-size: 13px;
}
.merge-forecast-choices button[aria-pressed='true'] {
  border-color: var(--mint);
  box-shadow: inset 0 0 0 1px var(--mint);
}
#mergePreviewBoard {
  max-width: 330px;
  pointer-events: none;
}
#mergePreviewBoard b {
  font-size: clamp(20px, 6vw, 30px);
}
.merge-apply {
  display: block;
  margin: 14px auto 0;
}
.arcade-review h3 {
  text-align: center;
  margin-bottom: 14px;
}
.arcade-review-facts {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}
.arcade-review-facts span {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 7px 11px;
  background: var(--bg);
  font-size: 13px;
}
.arcade-review > p {
  max-width: 560px;
  margin: 12px auto 18px;
  line-height: 1.9;
}
.arcade-snapshot {
  display: block;
  width: 100%;
  max-width: 560px;
  border-radius: 18px;
  margin: 0 auto;
}
.arcade-replay-controls {
  max-width: 560px;
  margin: 16px auto 0;
}
.arcade-replay-controls label {
  display: block;
  text-align: center;
  font-weight: 700;
}
.arcade-replay-controls input {
  display: block;
  width: 100%;
  direction: ltr;
  padding: 0;
  min-height: 44px;
  cursor: pointer;
  accent-color: var(--mint);
}
.merge-board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
  background: #132232;
  border: 1px solid #415263;
  padding: 12px;
  border-radius: 18px;
  width: 100%;
  max-width: 560px;
  aspect-ratio: 1;
  margin: 12px auto 0;
  touch-action: none;
  user-select: none;
  direction: ltr;
}
.merge-cell {
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: #223648;
  color: #1f2430;
  aspect-ratio: 1;
  min-width: 0;
}
.merge-cell.has-number {
  background: hsl(calc(47 - var(--tile-level) * 3) 80% calc(93% - var(--tile-level) * 4%));
}
.merge-cell b {
  font: 900 clamp(24px, 6vw, 48px)/1 Arial;
}
.merge-cell b.compact {
  font-size: clamp(18px, 4.8vw, 35px);
}
.merge-cell[data-value='1024'],
.merge-cell[data-value='2048'],
.merge-cell[data-value='4096'],
.merge-cell[data-value='8192'] {
  background: #ebbb57;
  box-shadow: inset 0 0 20px #ffdc9988;
}
.tile-new {
  animation: arcade-pop 0.15s ease-out;
}
.tile-merged {
  animation: arcade-bump 0.18s ease-out;
}
@keyframes arcade-pop {
  from {
    transform: scale(0.7);
    opacity: 0.5;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}
@keyframes arcade-bump {
  50% {
    transform: scale(1.08);
  }
}
.mine-mode {
  display: flex;
  gap: 8px;
  margin: 0 auto 18px;
  justify-content: center;
  flex-wrap: wrap;
}

  min-width: 150px;

  padding: 4px;

.mines-board {
  display: grid;
  grid-template-columns: repeat(var(--mine-size), minmax(0, 1fr));
  direction: ltr;
  gap: 4px;
  max-width: 560px;
  margin: 0 auto;
  min-width: 240px;
}
.mine-cell {
  min-height: 0;
  width: 100%;
  aspect-ratio: 1;
  border-radius: 6px;
  font: 800 clamp(14px, 2.7vw, 23px)/1 Arial;
  padding: 0;
  background: var(--raised);
  border: 1px solid var(--line);
  color: var(--ink);
  box-shadow: inset 0 -3px 0 #0002;
  user-select: none;
  touch-action: manipulation;
}
.mine-cell.revealed {
  background: var(--bg);
  box-shadow: none;
  border-color: var(--bg);
}
.mine-cell.flagged {
  color: #ffbe81;
}
.mine-cell.mine-neighbour {
  border-color: var(--orange);
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--orange) 45%, transparent);
}
.mine-cell.mine-clue {
  outline: 2px solid var(--lavender, #c4b2ff);
  outline-offset: -2px;
}
.mine-cell.mine-deduction-safe {
  border: 2px solid var(--mint);
  color: var(--mint);
}
.mine-cell.mine-deduction-mine {
  border: 2px solid var(--orange);
  color: var(--orange);
}
.mine-cell[data-count='1'].revealed {
  color: #90c9ff;
}
.mine-cell[data-count='2'].revealed {
  color: #8dddaf;
}
.mine-cell[data-count='3'].revealed {
  color: #ff9e92;
}
.mine-cell[data-count='4'].revealed {
  color: #c4b2ff;
}
.mine-cell[data-count='5'].revealed {
  color: #ffc277;
}
.mine-cell[data-count='6'].revealed {
  color: #92e5ee;
}
.mine-cell[data-count='7'].revealed {
  color: #ffa6dc;
}
.mine-cell[data-count='8'].revealed {
  color: var(--ink);
}
.mine-cell.mine-bomb {
  background: #4a2935;
  color: #ffbbb7;
}
.mine-cell.exploded {
  background: #da625b;
  color: white;
}
.mine-cell:disabled {
  opacity: 1;
}
.mine-cell:focus-visible {
  outline: 3px solid var(--orange);
  outline-offset: 0;
  z-index: 1;
}
.mines-large {

.wordguess-native {

}
.wordguess-native input {

}
.wordguess-native button {

}
.words-native {

}

}
.words-native > div {

}

}

  flex: none;
}
.words-native small {

}

  gap: 12px;
  margin-bottom: 20px;
}

.target-reaction-bars > div {

}

}
.target-order {
  display: flex;

  gap: 9px;
  justify-content: center;
  align-items: center;

}

  display: grid;
  place-items: center;

  border-radius: 50%;

}
.target-order > span.current,

}
.target-order i {

}

}

}

  position: absolute;
  bottom: 8px;
  right: 8px;
  min-width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--mint);
  color: #102c21;
  font-size: 16px;
}
.target-review {
  margin-top: 18px;
}
.target-review h3 {
  margin-bottom: 16px;
}
.target-reaction-bars {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-top: 20px;
}
.target-reaction-bars > div {
  font-size: 13px;
}
.target-grid {
  display: grid;
  grid-template-columns: repeat(var(--target-size), 1fr);
  gap: 12px;
  max-width: 630px;
  margin: 22px auto;
  direction: ltr;
  touch-action: manipulation;
}
.target-cell {
  position: relative;
  aspect-ratio: 1;
  min-height: 65px;
  padding: 0;
  border-radius: 19px;
  background: var(--raised);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: clamp(27px, 4vw, 45px);
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  user-select: none;
  transition:
    background 0.08s,
    border 0.08s;
  cursor: crosshair;
}
.target-key {
  position: absolute;
  inset-inline-end: 10px;
  top: 8px;
  font-size: 12px;
  opacity: 0.65;
  font-weight: 600;
}
.target-cell.decoy {
  border-color: #dc8d96;
  background: #5b323d;
}
.target-life-track {
  direction: ltr;
  overflow: hidden;
  height: 4px;
  max-width: 630px;
  border-radius: 5px;
  background: var(--line);
  margin: -8px auto 16px;
}
.target-life-track span {
  display: block;
  height: 100%;

}
.target-cell.active {
  background: linear-gradient(135deg, #3e5540, #325053);
  border: 2px solid #a6ebc7;
  box-shadow: inset 0 0 22px #a6ebc715;
}
.target-cell.active span {
  filter: drop-shadow(0 3px 5px #0005);
  transform: scale(1.2);
}
.target-feedback {
  text-align: center;
  min-height: 32px;
  font-weight: 700;
  color: var(--mint);
  line-height: 1.7;
}
.target-grid ~ .chips {
  justify-content: center;

  background: var(--raised);
  font-size: 22px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}
.party-format {
  margin: 18px 0;
  padding: 14px 18px;
  border: 1px solid var(--line);
  border-inline-start: 4px solid var(--mint);
  border-radius: 14px;
  background: var(--raised);
  text-align: start;
}
.party-format b {
  color: var(--mint);
}
.party-format p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}
.party-people {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px;
  margin: 18px 0;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--bg);
}
.party-people > div {
  min-width: 0;
  overflow-wrap: anywhere;
}
.party-people button {
  flex-shrink: 0;
}
.party-teams {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 18px 0;
  text-align: start;
}
.party-team {
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
  border-top: 3px solid var(--orange);
  background: var(--surface);
  min-width: 0;
}
.party-team-1 {
  border-top-color: var(--pink);
}
.party-team-title,
.party-matchbar,
.party-clockline,
.party-status,
.party-creative-author {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.party-team-title strong {
  color: var(--orange);
  font-size: 26px;
}
.party-team-1 .party-team-title strong {
  color: var(--pink);
}
.party-team-title > span {
  color: var(--muted);
  font-size: 12px;
}
.party-members {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.party-members span,
.party-speakers span {
  background: var(--raised);
  border: 1px solid var(--line);
  padding: 5px 10px;
  border-radius: 10px;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.party-round-card,
.party-prompt-card {
  padding-block: 30px;
}
.party-kicker {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 12px;
}
.party-captain {
  padding: 12px 20px;
  margin: 18px auto;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 14px;
  width: fit-content;
}
.party-round-card .note + .note {
  margin-top: 8px;
}
.party-matchbar,
.party-status {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 14px;
  padding: 12px 18px;
  margin-bottom: 14px;
}
.party-matchbar > strong {
  color: var(--mint);
}
.party-status {
  font-size: 13px;
  color: var(--muted);
}
.party-clockline .countdown {
  font-size: 34px;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.party-clockline .party-urgent {
  color: var(--red);
}
.party-time-track {
  height: 6px;
  border-radius: 8px;
  background: var(--raised);
  overflow: hidden;
  margin: 14px 0;
}
.party-time-track > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--orange);
  transition: width 0.2s linear;
}
.party-secret-card {
  text-align: center;
  padding: 22px 14px;
  min-height: 185px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.party-secret-word {
  font-size: clamp(30px, 6vw, 52px);
  font-weight: 800;
  color: var(--orange);
  line-height: 1.5;
  overflow-wrap: anywhere;
  margin: 18px 0;
}
.party-forbidden {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}
.party-forbidden span {
  color: var(--red);
  border: 1px solid var(--red);
  border-radius: 12px;
  padding: 8px 14px;
}
.party-question {
  font-size: clamp(20px, 4vw, 26px);
  margin: 24px 0;
  line-height: 1.7;
}
.party-answers,
.party-ballots {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 20px 0;
}
.party-answers button,
.party-ballots button {
  min-height: 64px;
  overflow-wrap: anywhere;
}
.party-answers .party-correct {
  color: var(--mint);
  border-color: var(--mint);
  opacity: 1;
}
.party-answers .party-wrong {
  color: var(--red);
  border-color: var(--red);
  opacity: 1;
}
.party-ballots button.selected,
.party-creative-entry.selected {
  color: var(--mint);
  border-color: var(--mint);
  box-shadow: inset 0 0 0 1px var(--mint);
}
.party-turn-summary {
  margin: 18px 0;
}
.party-private {
  border-top: 3px solid var(--pink);
  min-height: 290px;
}
.party-private h2,
.party-private .note {
  margin-bottom: 14px;
}
.party-private .actions button {
  min-height: 48px;
}
.party-lock,
.party-trophy {
  display: block;
  font-size: 52px;
  margin: 18px 0;
}
.party-trophy {
  font-size: 68px;
}
.party-speakers {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 22px 0;
}
.party-speakers .current {
  border-color: var(--orange);
  color: var(--orange);
  font-weight: 700;
}
.party-speakers .spoken {
  opacity: 0.65;
}
.party-word-reveal {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 22px 0;
}
.party-word-reveal > div {
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
}
.party-word-reveal small,
.party-word-reveal b {
  display: block;
}
.party-word-reveal b {
  font-size: 25px;
  color: var(--orange);
  margin-top: 6px;
}
.party-vote-results {
  margin: 22px 0;
}
.party-vote-results > div,
.party-timeline > div {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: start;
  padding: 12px 4px;
  border-bottom: 1px solid var(--line);
}
.party-vote-results > div > span:first-child,
.party-timeline p {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}
.party-vote-results > div > span:nth-child(2) {
  color: var(--muted);
  font-size: 13px;
}
.party-vote-results b,
.party-timeline strong {
  color: var(--mint);
}
.party-timeline > div > span {
  color: var(--muted);
  width: 22px;
  flex-shrink: 0;
}
.party-timeline small {
  display: block;
}
.party-session {
  margin-top: 18px;
}
.party-textarea {
  width: 100%;
  display: block;
  resize: vertical;
  min-height: 130px;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  font: inherit;
  line-height: 1.7;
}
.party-textarea + .note {
  font-variant-numeric: tabular-nums;
  text-align: end;
}
.party-textarea:focus-visible {
  outline: 3px solid var(--orange);
  outline-offset: 4px;
}
.party-creative-cards {
  display: grid;
  gap: 12px;
  margin: 22px 0;
}
.party-creative-entry {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px;
  text-align: start;
  font-weight: 400;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 16px;
  min-width: 0;
}
.party-creative-entry > p,
.party-creative-entry > span:nth-child(2) {
  flex: 1;
  overflow-wrap: anywhere;
  min-width: 0;
}
.party-creative-entry small {
  display: block;
  font-size: 12px;
  margin-top: 6px;
}
.party-entry-number {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--bg);
  color: var(--orange);
  font-weight: 800;
}
.party-creative-results {
  display: grid;
  gap: 12px;
  margin: 24px 0;
  text-align: start;
}
.party-creative-results > div {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--raised);
  padding: 18px;
  overflow-wrap: anywhere;
}
.party-creative-results > div.winning {
  border-color: var(--orange);
}
.party-creative-results p {
  margin: 10px 0;
}
.party-creative-author strong {
  color: var(--mint);
}
.party-champions {
  color: var(--orange);
  font-weight: 700;
  font-size: 22px;
  margin: 16px 0;
}
@media (max-width: 560px) {
  .party-flow {
    gap: 4px;
  }
  .party-flow li {
    flex-direction: column;
    gap: 6px;
    padding: 8px 4px;
    text-align: center;
    font-size: 10px;
  }
  .party-flow li > span {
    width: 22px;
    height: 22px;
  }
  .party-clue-trail > div {
    grid-template-columns: 1fr;
  }
  .party-people {
    flex-direction: column;
    align-items: stretch;
  }
  .party-teams {
    grid-template-columns: 1fr;
  }
  .party-team {
    padding: 14px;
  }
  .party-answers,
  .party-ballots {
    grid-template-columns: 1fr;
  }
  .party-creative-entry {
    padding: 14px;
    gap: 10px;
  }
  .party-format {
    padding: 12px;
  }
  .party-private .actions {
    display: grid;
    grid-template-columns: 1fr;
  }
}

/* Logic boards use physical coordinates while surrounding UI stays Arabic RTL. */
.lab-panel {
  padding: 20px;
}
.lab-mode,
.lab-tools,
.lab-line-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin: 4px auto 16px;
}
.lab-mode button,
.lab-tools button,
.lab-line-tools button {
  min-height: 44px;
  padding: 10px 15px;
}
.lab-tools {
  margin: 20px auto 8px;
}
.lab-line-tools {
  margin: -6px auto 12px;
}
.lab-line-tools button {
  font-size: 13px;
}
.lab-board-status {
  margin: 10px auto;
  max-width: 580px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.65;
  text-align: center;
}
.lab-lens {
  max-width: 580px;
  margin: 18px auto 0;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--raised);
  overflow: hidden;
}
.lab-lens-toggle {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 5px 12px;
  width: 100%;
  min-height: 48px;
  border: 0;
  border-radius: 0;
  padding: 12px 16px;
  text-align: start;
  background: transparent;
}
.lab-lens-toggle span {
  color: var(--muted);
  font-size: 12px;
  font-weight: 400;
}
.lab-lens-content {
  padding: 0 16px 16px;
  text-align: center;
  font-size: 13px;
}
.lab-lens-action {
  display: block;
  margin: 7px 0 12px;
  color: var(--mint);
}
.lab-lens-comparison {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.lab-lens-comparison > div {
  display: grid;
  align-content: start;
  gap: 7px;
  padding: 12px 8px;
  border: 1px solid var(--line);
  border-radius: 11px;
}
.lab-lens-comparison strong {
  color: var(--ink);
  font-size: clamp(15px, 4vw, 23px);
}
.lab-lens-comparison small,
.lab-lens-content p,
.lab-lens-note {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.75;
}
.lab-lens-content p {
  margin: 12px 0;
}
.lab-lens-content button {
  min-height: 44px;
  width: 100%;
}
.lab-lens-note {
  display: block;
  margin-top: 8px;
}
.lab-lens-pipe {
  width: 70px;
  height: 70px;
  margin: 12px auto 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #1a2a40;
  overflow: hidden;
}
.lab-lens-pipe svg {
  width: 100%;
  height: 100%;
}
.lab-lens-pipe path {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.lab-clue.lab-clue-selected {
  box-shadow: inset 0 0 0 2px #9e90ef;
}
.lab-preview-banner {
  max-width: 510px;
  margin: 10px auto;
  padding: 11px 14px;
  border: 1px dashed var(--mint);
  border-radius: 12px;
  color: var(--mint);
  font-size: 13px;
  line-height: 1.7;
  text-align: center;
}
.lab-projected-mark {
  position: absolute;
  bottom: 4px;
  left: 5px;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 5px;
  background: #223450;
  color: #e0f9f0;
  font:
    800 15px/1 Arial,
    sans-serif;
}
.lab-plan-summary {
  max-width: 510px;
  margin: 12px auto 18px;
  padding: 14px;
  border: 1px solid color-mix(in srgb, var(--mint) 45%, var(--line));
  border-radius: 14px;
  background: color-mix(in srgb, var(--mint) 7%, var(--raised));
  text-align: center;
}
.lab-plan-summary p {
  font-size: 13px;
  color: var(--muted);
  margin: 8px 0;
}
.lab-plan-summary .actions {
  margin: 10px 0 0;
}
.lab-tools small {
  opacity: 0.8;
  font-size: 12px;
}
.lab-message {
  min-height: 48px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
  max-width: 580px;
  margin: auto;
}
#labTime {
  direction: ltr;
  unicode-bidi: isolate;
}
.lab-scroll {
  direction: ltr;
  overflow-x: auto;
  padding: 5px 4px 9px;
  margin-inline: -4px;
}
.lab-nonogram {
  display: grid;
  grid-template-columns: 66px repeat(var(--lab-n), minmax(44px, 1fr));
  grid-template-rows: auto repeat(var(--lab-n), 1fr);
  direction: ltr;
  max-width: 545px;
  min-width: calc(66px + var(--lab-n) * 44px);
  margin: auto;
  gap: 3px;
  user-select: none;
}
.lab-clue {
  color: var(--ink);
  font:
    800 16px/1.35 Arial,
    sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
  background: var(--raised);
}
.lab-col-clue {
  flex-direction: column;
  justify-content: flex-end;
  padding: 6px 0;
  min-height: 50px;
}
.lab-row-clue {
  position: sticky;
  left: 0;
  z-index: 2;
  white-space: nowrap;
  letter-spacing: 2px;
  padding-inline: 3px;
}
.lab-clue-corner {
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 26px;
}
.lab-clue.lab-clue-done {
  color: var(--mint);
  background: color-mix(in srgb, var(--mint) 13%, var(--raised));
}
.lab-clue.lab-clue-conflict {
  color: #ffd1cb;
  background: #622e3a;
  outline: 1px solid #ef9187;
}
.lab-clue small {
  font-size: 11px;
  margin-inline: 2px;
}
.lab-cell {
  position: relative;
  display: grid;
  place-items: center;
  padding: 0;
  aspect-ratio: 1;
  min-height: 0;
  min-width: 0;
  border-radius: 8px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.lab-cell.lab-selected {
  box-shadow: inset 0 0 0 2px #9e90ef;
}
.lab-cell:focus-visible {
  outline: 3px solid var(--orange);
  outline-offset: 2px;
  z-index: 2;
}
.lab-pixel {
  border: 1px solid #53617b;
  background: #18243b;
  color: #c6d4e9;
  border-radius: 4px;
  font:
    700 30px/1 Arial,
    sans-serif;
}
.lab-pixel.lab-filled {
  background: #bbaeff;
  color: #182037;
  border-color: #dcd3ff;
}
.lab-pixel.lab-crossed {
  background: #111c30;
}
.lab-pixel.lab-fixed {
  cursor: default;
}
.lab-pixel.lab-hinted {
  outline: 3px dashed var(--orange);
  outline-offset: -4px;
}
.lab-fixed small {
  position: absolute;
  right: 3px;
  bottom: 3px;
  font-size: 8px;
  line-height: 1;
  color: currentColor;
}
.lab-square {
  display: grid;
  grid-template-columns: repeat(var(--lab-n), minmax(0, 1fr));
  max-width: 510px;
  width: 100%;
  gap: 8px;
  direction: ltr;
  margin: 12px auto;
  user-select: none;
}
.lab-lights-caption,
.lab-pipe-status {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px 18px;
  font-size: 13px;
  color: var(--muted);
  margin: 10px 0;
}
.lab-light {
  background: #162238;
  border: 1px solid #465879;
  color: #a5b2cd;
  font:
    800 clamp(24px, 7vw, 48px)/1 Arial,
    sans-serif;
  border-radius: 15px;
}
.lab-light.lab-lit {
  color: #342314;
  background: radial-gradient(circle at 35% 30%, #ffedb6, #ffc970);
  border-color: #ffe2a8;
  box-shadow: 0 0 15px #ffc97015;
}
.lab-light.lab-hinted {
  outline: 3px dashed #baaeff;
  outline-offset: -6px;
}
.lab-light.lab-affected {
  border: 2px solid #bfb1ef;
}
.lab-light.lab-selected {
  box-shadow: inset 0 0 0 3px #8d71d0;
}
.lab-light.lab-planned {
  outline: 3px solid #85dbc2;
  outline-offset: -6px;
}
.lab-plan-mark {
  display: grid;
  place-items: center;
  position: absolute;
  inset: 4px 4px auto auto;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  font-size: 16px;
  color: #152b32;
  background: #a3edcf;
  line-height: 1;
}
.lab-light small {
  font-size: 15px;
  position: absolute;
  top: 6px;
  right: 7px;
  color: #6650b2;
}
.lab-light:not(.lab-lit) small {
  color: #c9bdff;
}
.lab-pipes {
  gap: 4px;
  background: #111b2c;
  border: 2px solid #475775;
  padding: 5px;
  border-radius: 16px;
}
.lab-pipe {
  background: #1a2a40;
  border: 1px solid #3b4f6b;
  border-radius: 7px;
  overflow: hidden;
}
.lab-pipe.lab-connected {
  background: #163b48;
  border-color: #337d8a;
}
.lab-pipe.lab-source {
  background: #26464b;
  border-color: #c6dd95;
}
.lab-pipe.lab-locked {
  border-style: dashed;
  border-color: #e0cd9e;
}
.lab-lock-mark {
  position: absolute;
  bottom: 4px;
  right: 4px;
  font-size: 12px;
  line-height: 1;
}
.lab-leak-tip {
  fill: #ff9d90;
  stroke: #3a1d26;
  stroke-width: 2px;
}
.lab-pipe svg {
  display: block;
  width: 100%;
  height: 100%;
}
.lab-pipe path {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.lab-pipe-track {
  stroke: #7a8da4;
  stroke-width: 25;
}
.lab-pipe-water {
  stroke: #314962;
  stroke-width: 12;
}
.lab-pipe-water.lab-water-on {
  stroke: #91e3ed;
}
.lab-pipe-hub {
  fill: #7a8da4;
}
.lab-connected .lab-pipe-hub {
  fill: #91e3ed;
}
.lab-source .lab-pipe-hub {
  fill: #dcf0ad;
  stroke: #19343c;
  stroke-width: 3;
}
.lab-pipe .lab-source-drop {
  fill: #164e67;
  stroke: none;
}
.lab-live-dot {
  fill: #194e61;
}
.lab-pipe-hint {
  position: absolute;
  top: 3px;
  right: 4px;
  color: #fff1b5;
  text-shadow: 0 1px 3px #10182c;
}
.lab-pipe.lab-hinted {
  outline: 3px dashed #e1c890;
  outline-offset: -5px;
}
[data-theme='light'] .lab-pixel {
  background: #eef2f9;
  color: #66728c;
  border-color: #8f9eb4;
}
[data-theme='light'] .lab-pixel.lab-filled {
  background: #7561bc;
  color: #fff;
  border-color: #5f4ea0;
}
[data-theme='light'] .lab-pixel.lab-crossed {
  background: #e0e7f2;
  color: #4c5e7c;
}
[data-theme='light'] .lab-clue.lab-clue-conflict {
  background: #ffe0dc;
  color: #882a2b;
  outline-color: #c75d57;
}
[data-theme='light'] .lab-light:not(.lab-lit) {
  background: #e2e7f1;
  color: #59657b;
  border-color: #8090ab;
}
[data-theme='light'] .lab-light.lab-affected {
  border-color: #7254b3;
}
[data-theme='light'] .lab-pipes {
  background: #d9e6ed;
  border-color: #698a99;
}
[data-theme='light'] .lab-pipe {
  background: #e8f0f5;
  border-color: #96aebe;
}
[data-theme='light'] .lab-lens-pipe {
  background: #e8f0f5;
}
[data-theme='light'] .lab-pipe.lab-connected {
  background: #c2e6e7;
  border-color: #4f8f98;
}
[data-theme='light'] .lab-pipe.lab-source {
  background: #e0edbe;
  border-color: #809856;
}
[data-theme='light'] .lab-pipe-track,
[data-theme='light'] .lab-pipe-hub {
  stroke: #5e7a8e;
}
[data-theme='light'] .lab-pipe.lab-locked {
  border-color: #a48139;
}
@media (max-width: 600px) {
  .lab-panel {
    padding: 14px 12px;
  }
  .lab-square {
    gap: 5px;
  }
  .lab-nonogram {
    grid-template-columns: 56px repeat(var(--lab-n), minmax(44px, 1fr));
    min-width: calc(56px + var(--lab-n) * 44px);
    gap: 2px;
  }
  .lab-clue {
    font-size: 13px;
  }
  .lab-row-clue {
    letter-spacing: 1px;
  }
  .lab-cell {
    border-radius: 6px;
  }
  .lab-pixel {
    border-radius: 3px;
  }
  .lab-mode button,
  .lab-tools button {
    padding: 9px 12px;
    font-size: 13px;
  }
  .lab-message {
    font-size: 13px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .lab-cell {
    transition: none;
  }
}

.lab-row-clue.lab-clue-tight {
  font-size: 11px;
  letter-spacing: 0;
}

/* A calmer game lobby: clear hierarchy, spacious cards and tactile controls. */
:root {
  --bg: #0c101d;
  --surface: #151c2e;
  --raised: #202b40;
  --line: #2c3851;
  --mint: #9be8cf;
}
body {
  background: radial-gradient(ellipse at 80% 0, #25223b50, transparent 600px), var(--bg);
}
.shell {
  max-width: 1800px;
  margin-inline: auto;
  padding-inline: clamp(14px, 3vw, 56px);
}
.brandmark {
  background: linear-gradient(145deg, #bdffe7, #72cabf);
  color: #0d352e;
  box-shadow: 0 3px 20px #9be8cf20;
}
.top {
  padding-bottom: 20px;
  margin-bottom: 24px;
}
.brandtext small {
  letter-spacing: 0;
}
.lobby-hero {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  align-items: center;
  min-height: 388px;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 20% 30%, #4e386045, transparent 60%),
    linear-gradient(110deg, #171a2b, #18293b);
  border: 1px solid #354053;
  border-radius: 28px;
  padding: clamp(26px, 4vw, 62px);
  gap: 25px;
}
.lobby-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(#c8d7eb 0.7px, transparent 0.7px);
  background-size: 28px 28px;
  opacity: 0.11;
  pointer-events: none;
}
.lobby-copy {
  position: relative;
  z-index: 1;
}
.release-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid #819ca84a;
  padding: 6px 12px;
  border-radius: 100px;
  font-size: 12px;
  color: #d2ddd9;
  background: #151f2c90;
}
.release-chip > span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--mint);
  box-shadow: 0 0 9px var(--mint);
}
.lobby-copy h1 {
  font-size: clamp(39px, 4.1vw, 68px);
  margin-top: 19px;
  line-height: 1.2;
  letter-spacing: -1.5px;
}
.lobby-copy em {
  font-style: normal;
  color: #a3ead5;
}
.lobby-copy p {
  color: #bdc9d5;
  margin-top: 20px;
  max-width: 490px;
  font-size: 16px;
  line-height: 1.9;
}
.lobby-copy .actions {
  margin-top: 26px;
  justify-content: flex-start;
}
.lobby-copy .actions button {
  padding-inline: 24px;
  min-height: 50px;
  font-size: 14px;
  flex: 0 1 auto;
}
.lobby-party {
  background: #293345;
  border-color: #647185;
  color: #f2f4fb;
}
.lobby-details {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  color: #a8bacb;
  margin-top: 22px;
  font-size: 12px;
}
.lobby-art {
  height: 300px;
  position: relative;
  display: grid;
  place-items: center;
  direction: ltr;
  min-width: 0;
}
.art-ring {
  position: absolute;
  width: 270px;
  height: 270px;
  border: 1px solid #b6e8d324;
  border-radius: 50%;
  transform: rotate(-23deg) scaleY(0.65);
}
.art-ring.two {
  width: 360px;
  height: 360px;
  transform: rotate(35deg) scaleY(0.7);
  border-style: dashed;
  border-color: #cbb0ff27;
}
.art-glow {
  position: absolute;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: #85d8c0;
  filter: blur(72px);
  opacity: 0.13;
}
.art-dice {
  position: relative;
  width: 155px;
  height: 155px;
  transform: rotate(-16deg);
  border: 2px solid #b9fde9;
  border-radius: 36px;
  background: linear-gradient(135deg, #b7f7df, #66bba9);
  box-shadow:
    12px 15px 0 #24384a,
    15px 20px 30px #0007,
    inset -8px -8px 22px #1359522b;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  padding: 25px;
  gap: 10px;
}
.art-dice span {
  width: 19px;
  height: 19px;
  border-radius: 50%;
  background: #133d35;
  align-self: center;
  justify-self: center;
  box-shadow: inset 0 2px 3px #0004;
}
.art-dice span:nth-child(2) {
  grid-column: 3;
}
.art-dice span:nth-child(3) {
  grid-row: 2;
  grid-column: 2;
}
.art-dice span:nth-child(4) {
  grid-row: 3;
}
.art-dice span:nth-child(5) {
  grid-row: 3;
  grid-column: 3;
}
.art-ticket {
  position: absolute;
  border: 1px solid #becbe332;
  background: #293247e8;
  box-shadow: 0 8px 20px #0003;
  border-radius: 14px;
  padding: 13px 18px;
  direction: rtl;
  backdrop-filter: blur(10px);
}
.ticket-one {
  top: 26px;
  right: 6%;
  transform: rotate(8deg);
}
.ticket-one b {
  color: #ffd5a5;
  font-size: 28px;
  display: block;
  line-height: 1.3;
  direction: ltr;
  text-align: right;
}
.art-ticket small {
  font-size: 10px;
  display: block;
}
.ticket-two {
  bottom: 38px;
  left: 2%;
  transform: rotate(-7deg);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
}
.ticket-two span {
  font-size: 26px;
}
.art-spark {
  position: absolute;
  color: #c6b6ee;
  font-size: 32px;
}
.s-one {
  left: 10%;
  top: 26px;
}
.s-two {
  right: 12%;
  bottom: 30px;
  color: #e5c59f;
}
.art-caption {
  position: absolute;
  bottom: -6px;
  font-size: 8px;
  letter-spacing: 2.6px;
  color: #8198a9;
}
.lobby-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin: 18px 0 26px;
}
.lobby-summary > button {
  display: flex;
  align-items: center;
  text-align: right;
  gap: 14px;
  min-width: 0;
  background: var(--surface);
  padding: 19px;
  border-radius: 18px;
}
.lobby-summary > button > span:nth-child(2) {
  flex: 1;
}
.lobby-summary > button > span:last-child {
  color: var(--mint);
  font-size: 18px;
}
.lobby-summary b,
.lobby-summary small {
  display: block;
}
.lobby-summary b {
  font-size: 16px;
  margin-top: 4px;
}
.lobby-summary b small {
  display: inline;
  font-size: 10px;
  font-weight: 400;
}
.summary-icon {
  display: grid;
  place-items: center;
  background: var(--raised);
  border-radius: 14px;
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  font-size: 22px;
}
.mini-progress {
  display: block;
  background: var(--line);
  height: 3px;
  border-radius: 3px;
  margin-top: 9px;
  overflow: hidden;
}
.mini-progress::after {
  content: '';
  display: block;
  width: var(--progress);
  height: 100%;
  background: var(--mint);
}
.spotlight-grid {
  display: grid;
  grid-template-columns: 0.95fr 1.15fr;
  gap: 16px;
  margin: 24px 0 38px;
}
.spotlight-card {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 22px;
  padding: 24px;
  min-width: 0;
}
.spotlight-card h3 {
  margin: 8px 0 18px;
}
.group-spotlight {
  background: radial-gradient(ellipse at left bottom, #825da333, transparent 75%), var(--surface);
  display: flex;
  gap: 15px;
  align-items: center;
  overflow: hidden;
}
.group-spotlight > div {
  flex: 1;
}
.group-spotlight h2 {
  font-size: 27px;
  margin-top: 6px;
}
.group-spotlight h2 br {
  display: none;
}
.group-spotlight p {
  color: var(--muted);
  font-size: 13px;
  margin: 10px 0 15px;
  max-width: 280px;
}
.group-spotlight button {
  min-height: 40px;
  font-size: 12px;
  background: #332c45;
  border-color: #67577e;
}
.spotlight-emblem {
  font-size: 70px;
  transform: rotate(-12deg);
  filter: drop-shadow(10px 12px 0 #0002);
}
.routes-section {
  margin-bottom: 38px;
}
.routes-note {
  font-size: 12px;
  color: var(--muted);
}
.route-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.route-card {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  text-align: right;
  padding: 22px;
  border-radius: 20px;
  background: linear-gradient(
    140deg,
    color-mix(in srgb, var(--route), transparent 94%),
    var(--surface)
  );
  border-color: color-mix(in srgb, var(--route), var(--line) 77%);
  min-width: 0;
}
.route-card > div {
  min-width: 0;
  flex: 1;
}
.route-card small {
  color: var(--route);
  font-size: 11px;
}
.route-card h3 {
  margin-top: 5px;
  font-size: 20px;
}
.route-card p {
  color: var(--muted);
  font-size: 12px;
  font-weight: 400;
  margin-top: 10px;
  line-height: 1.9;
}
.route-icon {
  font-size: 28px;
  color: var(--route);
  border: 1px solid color-mix(in srgb, var(--route), transparent 70%);
  background: color-mix(in srgb, var(--route), transparent 94%);
  border-radius: 13px;
  width: 45px;
  height: 48px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.route-stops {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 18px;
  flex-wrap: wrap;
}
.route-stops span {
  font-size: 19px;
}
.route-stops i {
  color: var(--muted);
  font-style: normal;
}
.route-stops b {
  font-size: 10px;
  color: var(--route);
  margin-inline-start: auto;
}
.grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}
.gamecard {
  border-radius: 20px;
  transition:
    transform 0.15s,
    border-color 0.15s;
}
.gamecard:hover {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--tile), var(--line) 50%);
}
.cardstart {
  padding: 24px 22px 18px;
  min-height: 295px;
}
.cardstart h3 {
  font-size: 19px;
  margin-top: 14px;
}
.cardstart p {
  font-size: 13px;
  line-height: 1.85;
  margin-top: 10px;
}
.card-topline {
  display: flex;
  align-items: center;
  gap: 12px;
}
.card-topline .tileicon {
  margin-bottom: 0;
  width: 50px;
  height: 50px;
}
.new-chip {
  color: #b6eed7;
  background: #214339;
  border: 1px solid #68b29259;
  border-radius: 6px;
  font-size: 10px;
  padding: 2px 7px;
  font-style: normal;
}
.gamecard .fav {
  top: 15px;
  left: 15px;
  width: 30px;
  height: 30px;
  min-height: 30px;
}
.cardtime {
  font-size: 10px;
  color: var(--muted);
  margin-top: 12px;
  font-weight: 400;
}
.cardstart .tagline {
  margin-top: 15px;
  padding-top: 14px;
}
.cardstart .tagline b {
  font-size: 11px;
}
.worldtabs {
  grid-template-columns: repeat(6, 1fr);
}
.worldtab {
  font-size: 13px;
}
.catalog-sort {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.catalog-sort label {
  margin: 0;
  font-size: 11px;
}
.catalog-sort select {
  min-height: 36px;
  border-radius: 10px;
  width: auto;
  max-width: 155px;
  padding: 6px 10px;
  font-size: 11px;
}
.catalog-sort .linkbtn {
  font-size: 11px;
}
.dock {
  bottom: max(16px, env(safe-area-inset-bottom));
  padding: 8px;
  border-color: #71859e52;
  background: #1a2335f0;
  box-shadow: 0 12px 35px #0006;
}
.dock button {
  padding-inline: 20px;
}
.continue-route,
.saved-session {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  padding: 16px 20px;
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 16px;
}
.continue-route > span {
  font-size: 26px;
}
.continue-route > div {
  flex: 1;
}
.continue-route small {
  display: block;
  font-size: 11px;
  margin-top: 4px;
}
.continue-route button {
  font-size: 12px;
  min-height: 40px;
}
.lounge-games {
  display: grid;
  gap: 10px;
  margin-top: 22px;
}
.lounge-games > button {
  display: flex;
  align-items: center;
  text-align: right;
  gap: 14px;
  padding: 16px;
  background: var(--bg);
}
.lounge-games > button > span:first-child {
  font-size: 28px;
}
.lounge-games > button > div {
  flex: 1;
}
.lounge-games b,
.lounge-games small,
.lounge-games em {
  display: block;
}
.lounge-games b .new-chip {
  display: inline;
}
.lounge-games small {
  font-size: 11px;
  font-weight: 400;
  margin-top: 5px;
}
.lounge-games em {
  font-size: 10px;
  color: var(--mint);
  font-style: normal;
  margin-top: 6px;
}
.route-map {
  display: grid;
  gap: 10px;
  margin: 24px 0;
}
.route-map > div {
  display: flex;
  align-items: center;
  gap: 15px;
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 16px;
  border-radius: 14px;
}
.route-map > div > span {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  background: var(--raised);
  color: var(--mint);
  border-radius: 50%;
}
.route-map small {
  margin-inline-start: auto;
  font-size: 10px;
}
.journey-banner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border: 1px solid #567b6c;
  background: #203f342b;
  border-radius: 14px;
  padding: 14px 18px;
  margin-bottom: 18px;
  color: var(--mint);
  font-size: 13px;
}
.journey-banner > div {
  display: flex;
  align-items: center;
  gap: 8px;
}
.journey-banner > div span {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--muted);
}
.journey-banner .current,
.journey-banner .complete {
  background: var(--mint);
  color: #14392d;
  border-color: var(--mint);
}
.journey-banner i {
  font-style: normal;
  color: var(--line);
}
.route-result {
  margin-top: 18px;
  border-color: #557a6a;
}
.route-result h2 {
  margin: 9px 0;
}
body[data-theme='light'] .lobby-hero {
  background: linear-gradient(110deg, #eee8f8, #d7ece5);
  border-color: #abc9c0;
}
body[data-theme='light'] .lobby-copy h1 {
  color: #173c32;
}
body[data-theme='light'] .lobby-copy em {
  color: #296d5b;
}
body[data-theme='light'] .lobby-copy p,
body[data-theme='light'] .lobby-details {
  color: #405d57;
}
body[data-theme='light'] .release-chip {
  color: #27564c;
  background: #f6fffa;
  border-color: #9dc1b5;
}
body[data-theme='light'] .art-ticket {
  background: #f6f0ff;
  color: #302b4b;
  border-color: #b9abc9;
}
body[data-theme='light'] .ticket-one b {
  color: #91632f;
}
body[data-theme='light'] .dock {
  background: #edf4f6f5;
}
body[data-theme='light'] .new-chip {
  color: #205740;
  background: #d6eddf;
}
body[data-theme='light'] .topactions .iconbtn {
  background: #fff;
  color: var(--ink);
}
body[data-theme='light'] button.primary {

}
body[data-theme='light'] .route-card small,
body[data-theme='light'] .route-stops b,
body[data-theme='light'] .route-icon {

body[data-theme='light'] .route-card {

}
body[data-theme='light'] .group-spotlight button {
  background: #f2e9fb;
