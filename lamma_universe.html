  border-color: #bba6d0;
}
@media (min-width: 1600px) {
  .grid {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}
@media (max-width: 1100px) {
  .grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

    gap: 10px;
  }
  .route-card {
    padding: 16px;
    gap: 10px;
  }
  .route-icon {
    display: none;

    grid-template-columns: 1.1fr 0.9fr;
    padding: 34px;
  }
  .art-ring.two {
    width: 280px;
    height: 280px;
  }
  .ticket-two {
    font-size: 10px;
    padding: 10px;
  }
  .spotlight-emblem {
    font-size: 52px;
  }

    height: 235px;
    width: 100%;
    max-width: 400px;
    margin-inline: auto;
  }
  .lobby-copy h1 {
    font-size: clamp(38px, 7vw, 55px);

  .lobby-copy .actions button {

  .art-dice span {

  .art-ring {
    width: 240px;

  }
  .art-ring.two {

  }
  .ticket-one {

  }
  .ticket-one b {

  }
  .ticket-two {

  }
  .art-caption {
    bottom: 0;
  }
  .lobby-summary {
    gap: 8px;
    margin: 14px 0 20px;
  }
  .lobby-summary > button {
    padding: 14px 10px;

    display: block;
    text-align: center;
  }
  .lobby-summary .summary-icon {
    width: 32px;

    font-size: 18px;

  }

  }

/* Lamma 6: a compact lobby with stronger hierarchy and comfortable game screens. */
:root {
  --bg: #0d101b;
  --surface: #181d2d;
  --raised: #242b40;
  --line: #363d55;
  --mint: #b6efcf;
}
body {
  background: radial-gradient(ellipse at 100% 0, #39324d50, transparent 750px), var(--bg);
}
.lobby-hero {
  min-height: 335px;
  background:
    radial-gradient(ellipse at 15% 30%, #70659b35, transparent 60%),
    linear-gradient(115deg, #201f36, #192b36);
  border-color: #4b4a64;
}
.lobby-copy h1 {
  font-size: clamp(38px, 4vw, 64px);
}
.lobby-copy p {
  margin-top: 14px;
}
.lobby-details {
  align-items: center;
  flex-wrap: wrap;
}
.lobby-details .linkbtn {
  padding: 0;
  min-height: 30px;
  color: inherit;
  font-size: 12px;
}
.lobby-art {
  height: 270px;
}
.ticket-one b {
  font-size: 22px;
}
.quick-launch {
  display: grid;
  grid-template-columns: 1.1fr repeat(3, 1fr);
  gap: 12px;
  margin: 20px 0;
  align-items: stretch;
}
.quick-intro {
  align-self: center;
}
.quick-intro h2 {
  font-size: 21px;
  margin-top: 3px;
}
.quick-intro .linkbtn {
  padding-inline: 0;
  font-size: 12px;
}
.quick-game {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: right;
  padding: 20px 16px;
  background: var(--surface);
  min-width: 0;
  border-radius: 18px;
  border-color: color-mix(in srgb, var(--tile) 25%, var(--line));
}
.quick-game .tileicon {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  font-size: 24px;
  border-radius: 13px;
}
.quick-game > div {
  flex: 1;
  min-width: 0;
}
.quick-game b,
.quick-game small {
  display: block;
}
.quick-game b {
  font-size: 14px;
}
.quick-game small {
  font-size: 11px;
  font-weight: 400;
  margin-top: 4px;
}
.quick-game > span:last-child {
  color: var(--tile);
}
.discover-drawer {
  border: 1px solid var(--line);
  border-radius: 18px;
  margin: 24px 0 30px;
  background: var(--surface);
}
.discover-drawer > summary {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  cursor: pointer;
  list-style: none;
}
.discover-drawer > summary::-webkit-details-marker {
  display: none;
}
.discover-drawer > summary > span {
  font-weight: 700;
}
.discover-drawer > summary small {
  flex: 1;
}
.discover-drawer > summary b {
  font-size: 12px;
  color: var(--mint);
}
.discovery-content {
  padding: 0 20px 20px;
}
.discovery-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.discovery-actions button {
  font-size: 13px;
}
.discovery-content .routes-section {
  margin: 24px 0 0;
}
.setup-memory {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  margin-top: 22px;
  border-top: 1px solid var(--line);
  padding-top: 14px;
  font-size: 12px;
  color: var(--muted);
}
.setup-memory .linkbtn {
  font-size: 12px;
}
.mood-tabs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  margin: 22px 0;
}
.mood-tabs button {
  font-size: 13px;
}
.mood-tabs .active {
  background: var(--mint);
  color: #182923;
  border-color: transparent;
}
.picker-games {
  display: grid;
  gap: 12px;
  margin: 12px 0 22px;
}
.picker-games > button {
  display: flex;
  text-align: right;
  align-items: center;
  gap: 14px;
  padding: 17px;
  border-radius: 16px;
}
.picker-games .tileicon {
  width: 48px;
  height: 48px;
  font-size: 25px;
  flex-shrink: 0;
}
.picker-games > button > div {
  flex: 1;
  min-width: 0;
}
.picker-games p {
  font-size: 12px;
  color: var(--muted);
  font-weight: 400;
  margin: 4px 0;
}
.picker-games small {
  font-size: 11px;
  font-weight: 400;
}
.history-rounds {
  margin: 18px 0;
}
.history-round {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}
.history-round .tileicon {
  width: 40px;
  height: 40px;
  font-size: 22px;
  flex-shrink: 0;
}
.history-round > div {
  flex: 1;
  min-width: 0;
}
.history-round b,
.history-round small {
  display: block;
}
.history-round b {
  font-size: 14px;
}
.history-round small {
  font-size: 11px;
}
.history-round strong {
  color: var(--mint);
  font-size: 15px;
}
.dock button.active {
  background: var(--raised);
  color: var(--mint);
}
body.playing .dock {
  display: none;
}
.playhead {
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px 20px;
  background: var(--surface);
}
.playtools button {
  border-radius: 12px;
}
.play .panel {
  border-radius: 22px;
}
.play .stats {
  gap: 10px;
}
@media (min-width: 1100px) {
  .grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .cardstart {
    min-height: 265px;
  }
}
@media (max-width: 900px) {
  .quick-launch {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .quick-intro {
    grid-column: 1 / -1;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .quick-intro .world-label {
    display: none;
  }
  .quick-intro .linkbtn {
    margin-inline-start: auto;
  }
  .quick-game {
    padding: 16px 12px;
    flex-direction: column;
    align-items: start;
    gap: 9px;
    position: relative;
  }
  .quick-game > span:last-child {
    position: absolute;
    inset-inline-end: 12px;
    top: 12px;
  }
}
@media (max-width: 600px) {
  .lobby-hero {
    min-height: 0;
    padding: 26px 23px;
    grid-template-columns: 1fr;
  }
  .lobby-copy h1 {
    font-size: 40px;
    margin-top: 14px;
  }
  .lobby-copy p {
    font-size: 13px;
    margin-top: 12px;
  }
  .lobby-art {
    display: none;
  }
  .lobby-copy .actions {
    margin-top: 18px;
  }
  .lobby-summary {
    gap: 7px;
    margin-bottom: 16px;
  }
  .lobby-summary > button {
    border-radius: 13px;
    padding: 12px 9px;
  }
  .quick-launch {
    gap: 8px;
  }
  .quick-game {
    padding: 13px 10px;
    border-radius: 14px;
  }
  .quick-game .tileicon {
    width: 36px;
    height: 36px;
    font-size: 22px;
  }
  .quick-game b {
    font-size: 12px;
  }
  .quick-game small {
    font-size: 10px;
  }
  .quick-intro h2 {
    font-size: 19px;
  }
  .discover-drawer {
    margin: 20px 0;
  }
  .discover-drawer > summary {
    padding: 14px;
    gap: 10px;
  }
  .discover-drawer > summary > span {
    font-size: 13px;
    flex: 1;
  }
  .discover-drawer > summary small {
    display: none;
  }
  .discovery-content {
    padding: 0 13px 15px;
  }
  .discovery-actions button {
    font-size: 11px;
  }
  .setup-memory {
    flex-direction: column;
    align-items: start;
    gap: 0;
  }
  .cardstart {
    padding: 18px 13px 13px;
    min-height: 260px;
  }
  .cardstart p {
    font-size: 12px;
  }
  .playhead {
    padding: 13px 11px;
    gap: 9px;
    border-radius: 16px;
  }
  .playhead h2 {
    font-size: 19px;
  }
  .playhead .tileicon {
    width: 37px;
    height: 37px;
    font-size: 22px;
  }
  .playtools {
    gap: 5px;
  }
  .playtools button {
    min-width: 36px;
    min-height: 38px;
    padding: 6px 9px;
  }
  .mood-tabs button {
    font-size: 12px;
    padding-inline: 10px;
  }
  .picker-games > button {
    padding: 13px;
  }
  .history-round {
    gap: 9px;
  }
}
body[data-theme='light'] .lobby-hero {
  background:
    radial-gradient(ellipse at 15% 30%, #d6c9eb80, transparent 60%),
    linear-gradient(115deg, #f0eaf9, #e0f1eb);

}
body[data-theme='light'] .mood-tabs .active {

  color: #fff;
}

  color: #235c4a;

/* A compact play surface keeps feedback and input together on phones. */
:root {
  --play-viewport-height: 100dvh;
  --play-viewport-top: 0px;
}
.skiplink:not(:focus-visible) {
  top: -100px;
  opacity: 0;
  pointer-events: none;
}
.play {
  max-width: 880px;
  min-width: 0;
}
.play .note,
.play .tiny {
  overflow-wrap: anywhere;
}
.playhead {
  gap: 12px;
}
.playhead > div:not(.playtools) {
  min-width: 0;
}
.playtools {
  flex-shrink: 0;
}
.playtools .focus-toggle[aria-pressed='true'] {
  background: var(--mint);
  color: #16382b;
}
.solo-panel {
  padding: 22px;
}
.solo-heading {
  display: flex;
  gap: 12px;
  align-items: center;
}
.solo-heading > span {
  font-size: 32px;
}
.solo-heading h3 {
  font-size: 20px;
}
.number-range {
  margin: 12px 0;
}
.number-range .range {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  font-size: clamp(16px, 3vw, 24px);
  color: var(--ink);
  font-weight: 700;
}
.number-range bdi {
  min-width: 0;
  overflow-wrap: anywhere;
}
.number-track {
  height: 9px;
  border-radius: 20px;
  background: var(--raised);
  position: relative;
  overflow: hidden;
  margin: 12px 0 5px;
}
.number-track > span {
  position: absolute;
  top: 0;
  bottom: 0;
  background: linear-gradient(90deg, var(--blue), var(--mint));
  min-width: 2px;
  border-radius: inherit;
  transition:
    left 0.25s,
    width 0.25s;
}
.range-original {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  color: var(--muted);
  font-size: 11px;
}
.guess-feedback {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border: 1px solid color-mix(in srgb, var(--mint) 35%, var(--line));
  background: color-mix(in srgb, var(--mint) 7%, var(--bg));
  border-radius: 16px;
  margin-block: 15px;
  scroll-margin-block: 12px;
}
.guess-feedback .feedback-arrow {
  display: grid;
  place-items: center;
  flex: 0 0 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--raised);
  color: var(--mint);
  font-size: 25px;
}
.guess-feedback b {
  display: block;
  font-size: 15px;
  line-height: 1.7;
}
.guess-feedback small {
  display: block;
  margin-top: 3px;
  overflow-wrap: anywhere;
}
.guess-feedback.lower .feedback-arrow {
  color: var(--blue);
}
.guess-feedback.invalid {
  border-color: var(--red);
}
.guess-entry {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: stretch;
}
.guess-entry input {
  min-width: 0;
  font-size: 25px;
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.guess-entry input::placeholder {
  font-size: 16px;
  letter-spacing: 0;
}
.guess-entry .primary {
  padding-inline: 22px;
}
.input-options {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px;
  margin-top: 5px;
}
.input-options .linkbtn {
  min-height: 44px;
  padding: 6px 2px;
}
.solo-keypad {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 8px 0 14px;
}
.solo-keypad button {
  min-height: 48px;
  padding: 5px;
  font-size: 21px;
  font-variant-numeric: tabular-nums;
}
.solo-keypad button:nth-child(10) {
  font-size: 13px;
}
.solo-assists {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 0 6px;
}
.solo-assists > button:first-child {
  flex: 1;
}
.solo-assists small {
  display: block;
  font-weight: 400;
  font-size: 11px;
}
.solo-assists .quiet {
  color: var(--muted);
}
.solo-stats .stat {
  min-width: 0;
}
.solo-stats .stat b {
  overflow-wrap: anywhere;
  font-size: 22px;
}
.solo-history ol {
  padding: 0;
  list-style: none;
}
.solo-history li {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 7px;
  border-bottom: 1px solid var(--line);
}
.solo-history bdi {
  overflow-wrap: anywhere;
  min-width: 0;
}
.solo-history li > span {
  flex-shrink: 0;
  color: var(--muted);
}
.round-review {
  text-align: start;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 15px;
  margin-top: 20px;
}
.round-review summary {
  cursor: pointer;
  min-height: 44px;
  display: flex;
  align-items: center;
  font-weight: 700;
}
.round-review summary::after {
  content: '+';
  margin-inline-start: auto;
  color: var(--mint);
}
.round-review[open] summary::after {
  content: '−';
}
.round-review ol {
  padding: 0;
  list-style: none;
}
.round-review li {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.round-review li bdi {
  overflow-wrap: anywhere;
}
.result-path {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  margin-top: 18px;
  border-top: 1px solid var(--line);
  padding-top: 18px;
  text-align: start;
}
.result-path > span {
  font-size: 13px;
  color: var(--muted);
}
body.focus-play .top,
body.focus-play .foot,
body.focus-play .dock {
  display: none;
}
body.focus-play .shell {
  padding-top: 12px;
  padding-bottom: 20px;
}
body.keyboard-open .top,
body.keyboard-open .foot,
body.keyboard-open .dock {
  display: none;
}
body.keyboard-open .shell {
  padding-top: 8px;
  padding-bottom: 18px;
}
body.keyboard-open .playhead {
  padding: 8px 12px;
  margin-bottom: 8px;
}
body.keyboard-open .playhead .tileicon,
body.keyboard-open .playhead p {
  display: none;
}
body.keyboard-open .play .stats {
  gap: 6px;
  margin-bottom: 8px;
}
body.keyboard-open .play .stat {
  padding: 5px 8px;
}
body.keyboard-open .solo-heading,
body.keyboard-open .range-original,
body.keyboard-open .solo-history {
  display: none;
}
body.keyboard-open .solo-panel {
  padding: 12px;
  margin-top: 8px;
}
body.keyboard-open .number-range {
  margin-block: 4px;
}
body.keyboard-open .guess-feedback {
  margin-block: 8px;
  padding: 8px 10px;
}
body.keyboard-open .guess-feedback b {
  font-size: 13px;
}
body.keyboard-open .guess-entry input {
  min-height: 48px;
  padding: 6px;
}
body.keyboard-open .modalback {
  top: var(--play-viewport-top);
  bottom: auto;
  height: var(--play-viewport-height);
  padding: 8px;
  align-items: center;
}
body.keyboard-open .modal {
  max-height: calc(var(--play-viewport-height) - 16px);
}
body.keyboard-open .toast {
  top: calc(var(--play-viewport-top) + 8px);
  bottom: auto;
}
@media (max-width: 600px) {
  body.playing .shell {
    padding-top: 12px;
  }
  body.playing .top {
    gap: 8px;
    margin-bottom: 12px;
    padding-bottom: 10px;
  }
  body.playing .brandtext,
  body.playing .foot {
    display: none;
  }
  body.playing .topactions {
    gap: 3px;
  }
  body.playing .topactions .iconbtn {
    width: 44px;
    min-height: 44px;
    padding: 3px;
  }
  body.playing .topactions span {
    display: none;
  }
  .play[data-game='finder'] .stat:nth-child(3) b {
    font-size: clamp(11px, 3.5vw, 14px) !important;
  }
  .playhead {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    padding: 12px;
  }
  .playhead > .tileicon {
    display: none;
  }

const makeItem = (r) => ({
  name: r[0],
  cat: r[1],
  tags: new Set([r[1], ...r[2].split(' ')]),
  hints: r.slice(3, 6),
  aliases: [r[0], ...(r[6] || '').split('|')].filter(Boolean),
});
items.push(...extraRows.map(makeItem));
const builtInCount = items.length;
let pendingKnowledgeSync = false;
function syncLearned(force = false) {
  if (!force && state && !state.done && !['home', 'setup', 'tour-handoff'].includes(screen)) {
    pendingKnowledgeSync = true;
    return false;
  }
  items.splice(builtInCount);
  const builtInNames = new Set(items.map((v) => norm(v.name)));
  store.extra.learned = store.extra.learned.filter((v) => !builtInNames.has(norm(v.name)));
  items.push(
    ...store.extra.learned.map((v) => ({
      name: v.name,
      cat: v.cat,
      tags: new Set([v.cat, ...v.tags]),
      hints: v.hints,
      aliases: [
        v.name,
        ...(Array.isArray(v.aliases)
          ? v.aliases.filter((a) => typeof a === 'string' && a.length < 50)
          : []),
      ],
    })),
  );
  pendingKnowledgeSync = false;
  return true;
}

      e.preventDefault();
      e.stopImmediatePropagation();

    if (e.key === 'Tab') {
      e.stopImmediatePropagation();
      const controls = [
        ...container.querySelectorAll('button,input,select,textarea,a[href],[tabindex="0"]'),
      ].filter((v) => !v.disabled && v.getClientRects().length && v.tabIndex >= 0);
      if (!controls.length) {
        e.preventDefault();
        container.focus();
        return;
      }
      const first = controls[0],
        last = controls.at(-1);
      if (
        e.shiftKey &&
        (document.activeElement === first || !container.contains(document.activeElement))
      ) {
        e.preventDefault();
        last.focus();
      } else if (
        !e.shiftKey &&
        (document.activeElement === last || !container.contains(document.activeElement))
      ) {
        e.preventDefault();
        first.focus();

    }
  },

);

async function importProgress(file) {

    const obj = JSON.parse(await file.text());
    if (obj?.format !== 'lamma-universe' || obj.version !== 3 || !obj.data) throw Error();

      extra = normalizeExtra(obj.data.extra, true);

      extra.learned.some((v) =>

      )

      throw Error('Duplicate learned item');
    pendingImport = { ...base, extra };

      '<div class="modalhead"><h2 id="modaltitle">استيراد النسخة</h2><button onclick="closeModal()">✕</button></div><p>النسخة صالحة. الاستيراد يستبدل الأسماء والنقاط والإضافات المحفوظة حالياً.</p><div class="actions"><button onclick="closeModal()">إلغاء</button><button class="primary" onclick="confirmImport()">استيراد</button></div>',

function result(id, title, text, points = 0, detail = '') {
  if (state?.resultShown) return;
  if (state) state.resultShown = true;
  points = Number.isFinite(points)
    ? Math.min(Number.MAX_SAFE_INTEGER, Math.max(0, Math.round(points)))
    : 0;
  clearTimers();
  if (state) state.done = true;
  removePause();
  if (points === 0 && !state?.roundRecorded) addScore(state?.name || player(), 0);
  if (dailyRun && dailyRun.id === id) {
    const k = dailyRun.date + ':' + id;
    store.extra.daily[k] = Math.max(store.extra.daily[k] || 0, points);
    store.extra.daily[dailyRun.date + ':done:' + id] = 1;
  }
  updateBadges();
  save();
  tone(points > 0);
  if (points > 0 && store.extra.motion) confetti();
  setHTML(
    wrap(
      id,
      `<section class="panel success center celebrate"><div class="resulticon">${points ? '🏆' : '✦'}</div><h2>${title}</h2>${detail ? `<div class="resultnum">${esc(detail)}</div>` : ''}<p class="muted" style="margin-top:12px">${text}</p><div class="chips" style="justify-content:center"><span class="chip">+${Math.round(points)} نقطة</span>${dailyRun ? '<span class="chip">انحفظت نتيجة اليوم ✓</span>' : ''}</div><div class="actions">${tourney?.active ? '<button class="primary" onclick="nextTournament()">الدور التالي ←</button>' : `<button class="primary" onclick="setup('${id}')">جولة جديدة</button>${dailyRun ? '<button onclick="openDaily()">تحدّيات اليوم</button>' : ''}`}<button onclick="home()">العالم</button></div></section>`,
    ),
  );
}

function dayKey() {

function dayGames() {

  const rng = makeSeed('daily-selection:' + dayKey());
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [ids[i], ids[j]] = [ids[j], ids[i]];

}

let seededRandom = null;
function makeSeed(seed) {
  let x = 2166136261;
  for (const c of seed) {
    x ^= c.charCodeAt(0);
    x = Math.imul(x, 16777619);
  }
  return () => {
    x += 0x6d2b79f5;
    let t = x;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

// Fullscreen is requested only by an explicit button click.
async function toggleFullscreen() {
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) await exit.call(document);
    } else {
      const enter =
        document.documentElement.requestFullscreen ||
        document.documentElement.webkitRequestFullscreen;
      if (!enter) {
        toast('اللعبة تملأ مساحة المتصفح بالفعل. للشاشة الكاملة جرّب F11 من لوحة المفاتيح.');
        return;
      }
      await enter.call(document.documentElement);
    }
    fullscreenUI();
  } catch (e) {
    toast('المتصفح لم يسمح بالشاشة الكاملة. تقدر تستخدم F11 من لوحة المفاتيح.');
  }
}
function fullscreenUI() {
  const b = $('fullscreen');
  if (!b) return;
  const active = !!(document.fullscreenElement || document.webkitFullscreenElement);
  b.setAttribute('aria-pressed', String(active));
  b.setAttribute('aria-label', active ? 'الخروج من الشاشة الكاملة' : 'تشغيل الشاشة الكاملة');
  b.title = active ? 'الخروج من الشاشة الكاملة' : 'الشاشة الكاملة';
  b.innerHTML = `${active ? '⛶' : '⛶'}<span>${active ? 'خروج' : 'شاشة كاملة'}</span>`;
}

document.addEventListener('keydown', (event) => {
  if (
    !wordsGameIds.has(screen) ||
    wordsBlocked(screen) ||
    event.ctrlKey ||
    event.metaKey ||
    event.altKey ||
    event.isComposing ||
    event.repeat ||
    event.target.closest?.('input,select,textarea,[contenteditable="true"]')
  )
    return;
  if (
    ['Enter', ' '].includes(event.key) &&
    event.target.closest?.('button,a,summary,[role="button"]')
  )
    return;
  if (
    screen === 'target' &&
    ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)
  ) {
    const cell = event.target.closest?.('.target-cell');
    if (!cell && event.target.closest?.('button,a,summary')) return;
    event.preventDefault();
    const index = cell ? Number(cell.dataset.index) : 0,
      row = Math.floor(index / state.size),
      column = index % state.size,
      next =
        event.key === 'Home'
          ? row * state.size
          : event.key === 'End'
            ? (row + 1) * state.size - 1
            : event.key === 'ArrowUp'
              ? Math.max(0, row - 1) * state.size + column
              : event.key === 'ArrowDown'
                ? Math.min(state.size - 1, row + 1) * state.size + column
                : event.key === 'ArrowLeft'
                  ? row * state.size + Math.max(0, column - 1)
                  : row * state.size + Math.min(state.size - 1, column + 1);
    document.querySelector(`.target-cell[data-index="${next}"]`)?.focus({ preventScroll: true });
    return;
  }
  if (screen === 'trivia') {
    if (state.locked && event.key === 'Enter') {
      event.preventDefault();
      nextTrivia();
    } else if (!state.locked && /^[1-4]$/.test(latin(event.key))) {
      event.preventDefault();
      answerTrivia(Number(latin(event.key)) - 1);
    }
    return;
  }
  if (screen === 'target' && state.size === 3 && /^[1-9]$/.test(latin(event.key))) {
    event.preventDefault();
    hitTarget(Number(latin(event.key)) - 1, state.token);
    return;
  }
  if (screen === 'hangman' && state.over && event.key === 'Enter') {
    event.preventDefault();
    nextHangman();
    return;
  }
  if (screen === 'hangman' && !state.over) {
    const letter = wordsNormalizeKey(event.key);
    if (arabicKeyboard.includes(letter)) {
      event.preventDefault();
      guessHangman(letter);
    }
    return;
  }
  if (screen === 'wordguess' && state.over && event.key === 'Enter') {
    event.preventDefault();
    finishWordguess();
    return;
  }
  if (screen === 'wordguess' && !state.over) {
    if (event.key === 'Enter') {
      event.preventDefault();
      submitWordguess();
    } else if (event.key === 'Backspace') {
      event.preventDefault();
      typeWordguess('backspace');
    } else {
      const letter = wordsNormalizeKey(event.key);
      if (arabicKeyboard.includes(letter)) {
        event.preventDefault();
        typeWordguess(letter);
      }
    }
  }
});

function partyBlocked(id) {
  return (
    screen !== id ||
    state?.id !== id ||
    state.done ||
    state.pausedAt ||
    !$('modalback').hidden ||
    !!$('pausecover')

}
function partyStage(id, stage) {
  return !partyBlocked(id) && state.stage === stage;
}
function partyReadOption(id, options, fallback) {
  const n = Number($(id)?.value);
  return options.includes(n) ? n : fallback;
}
function partyDraftTeams(mode) {
  const all = shuffle(store.players),
    teams = [[], []],
    strength = [0, 0];
  if (mode === 'balanced') all.sort((a, b) => partyStrength(b) - partyStrength(a));
  for (const name of all) {
    const team =
      teams[0].length !== teams[1].length
        ? teams[0].length < teams[1].length
          ? 0
          : 1
        : mode === 'balanced' && strength[0] !== strength[1]
          ? strength[0] < strength[1]
            ? 0
            : 1
          : randInt(2);
    teams[team].push(name);
    strength[team] += partyStrength(name);
  }
  return teams;
}
function partyStrength(name) {
  const score = store.scores[name];
  return score?.rounds ? score.points / score.rounds : 0;
}
function partyTeamsHTML(teams, names = ['الفريق الأول', 'الفريق الثاني'], scores = null) {

}
function partyRemixTeams() {

function startPartyGame(id) {
  if (screen !== 'setup' || state?.id !== id || !partyGameIDs.has(id)) return;
  const minimum = id === 'teamcup' ? 4 : 3;
  if (store.players.length < minimum) return toast(`أضيفوا ${minimum} لاعبين على الأقل.`);
  const players = [...store.players];
  const options = {
    rounds: partyReadOption('partyRounds', [1, 3, 5, 8], id === 'improv' ? 5 : 3),
    duration: partyReadOption(
      'partyDuration',
      [0, 45, 60, 90, 150, 240],

  const teams = state.teams,
    wordCategory = Object.hasOwn(partyPairCategories, $('partyWordCategory')?.value)

    creativeFormat = Object.hasOwn(partyCreativeFormats, $('partyCreativeFormat')?.value)
      ? $('partyCreativeFormat').value
      : 'free',
    teamNames = [
      $('partyTeamA')?.value.trim() || 'الصقور',
      $('partyTeamB')?.value.trim() || 'التنانين',
    ];
  if (id === 'teamcup' && norm(teamNames[0]) === norm(teamNames[1]))
    return toast('اختاروا اسماً مختلفاً لكل فريق.');
  clearTimers();
  screen = id;
  state = {
    id,
    players,
    results: Object.fromEntries(players.map((n) => [n, 0])),
    done: false,
    round: 0,
    ...options,
  };
  if (id === 'teamcup') {
    Object.assign(state, {
      teams,
      teamNames,
      turn: 0,
      teamScores: [0, 0],
      history: [],
      decks: {
        mime: shuffle(items.map((v) => v.name)),
        taboo: shuffle(tabooDeck),
        trivia: shuffle(triviaBank),
      },
      deckIndex: { mime: 0, taboo: 0, trivia: 0 },
      cardToken: 0,
      onPause: () => {
        if (state?.id === 'teamcup' && state.stage === 'active' && state.mode !== 'trivia') {
          state.hiddenCard = true;
          renderTeamCup();
        }
      },
    });
    teamCupHandoff();
  } else if (id === 'undercover') {
    const category = partyPairCategories[wordCategory];
    Object.assign(state, {
      pairs: shuffle(
        partyPairs.filter((pair) => !category.words || category.words.includes(pair[0])),
      ),
      wordCategory,
      roleCounts: players.map(() => 0),
      startingPlayer: randInt(players.length),
      onPause: partyUndercoverPause,
    });
    undercoverRound();
  } else {
    Object.assign(state, {
      prompts: shuffle(partyCreativePrompts).slice(0, options.rounds),
      creativeFormat,
      history: [],
      onPause: partyCreativePause,
    });
    creativeRound();
  }
  goTop();
}

// Team tournament: equal timed turns, rotating captains and one final score write.
function teamCupInfo() {
  const s = state,
    cycle = Math.floor(s.turn / 2),
    team = ((s.turn % 2) + cycle) % 2;
  return {
    cycle,
    team,
    captain:
      s.teams[team][(cycle + Math.floor(cycle / s.teams[team].length)) % s.teams[team].length],
    mode: partyModes[cycle % partyModes.length],
  };
}
function teamCupHandoff() {

  s.endAt = 0;

  s.stage = 'handoff';
  const info = teamCupInfo();
  s.mode = info.mode.id;
  setHTML(
    partyWrap(
      'teamcup',
      `${partyTeamsHTML(s.teams, s.teamNames, s.teamScores)}<section class="panel center party-round-card"><p class="party-kicker">الجولة ${info.cycle + 1} / ${s.cycles} · ${info.mode.icon} ${info.mode.name}</p><h2>دور فريق ${esc(s.teamNames[info.team])}</h2><div class="party-captain">القائد: <b>${esc(info.captain)}</b></div><p class="note">${info.mode.rule}</p><p class="note">${s.duration} ثانية · ${info.mode.id === 'trivia' ? 'الشاشة يشاهدها الفريق كله، والخصم يراقب.' : 'الشاشة للقائد فقط، زملاؤه يخمنون، والخصم يراقب الوقت.'}</p><div class="actions"><button class="primary" onclick="teamCupBegin()">الفريق جاهز، ابدأ الوقت</button></div></section>`,
    ),

}
function teamCupBegin() {
  if (!partyStage('teamcup', 'handoff')) return;
  Object.assign(state, {
    stage: 'active',
    turnScore: 0,
    correct: 0,
    skips: 0,
    violations: 0,
    turnLog: [],
    hiddenCard: false,
    boostUsed: false,
    boostActive: false,
    endAt: Date.now() + state.duration * 1000,
    feedback: null,

  teamCupNextCard();
  renderTeamCup();
  const s = state;
  repeat(() => {
    if (state !== s || s.stage !== 'active' || partyBlocked('teamcup')) return;
    const seconds = partySeconds(s);
    if ($('teamCupClock')) {
      $('teamCupClock').textContent = seconds;
      $('teamCupClock').classList.toggle('party-urgent', seconds <= 10);
    }
    if ($('teamCupTimebar')) $('teamCupTimebar').style.width = (seconds / s.duration) * 100 + '%';
    if (!seconds) teamCupEndTurn();

}
function partySeconds(s = state) {
  return Math.max(0, Math.ceil((s.endAt - (s.pausedAt || Date.now())) / 1000));
}
function teamCupNextCard() {
  const s = state,
    mode = s.mode;
  if (s.deckIndex[mode] >= s.decks[mode].length) {
    const last = s.card;
    s.decks[mode] = shuffle(s.decks[mode]);
    if (s.decks[mode].length > 1 && s.decks[mode][0] === last)
      [s.decks[mode][0], s.decks[mode][1]] = [s.decks[mode][1], s.decks[mode][0]];
    s.deckIndex[mode] = 0;
  }
  s.card = s.decks[mode][s.deckIndex[mode]++];
  s.cardToken = ++partyActionSerial;
  s.feedback = null;
  s.boostActive = false;
  if (mode === 'trivia') s.choices = shuffle(s.card.choices);
}

  else

      : `<div class="party-secret-card"><p class="party-kicker">${s.mode === 'mime' ? 'مثّل بدون كلام' : 'اشرح دون الكلمات الممنوعة'}</p><div class="party-secret-word">${esc(s.mode === 'mime' ? s.card : s.card[0])}</div>${

  setHTML(

function teamCupToggleCard() {

function partyCardToken() {

function teamCupBoost(token = partyCardToken()) {

    return;
  if (token !== undefined && String(token) !== String(state.cardToken)) return;

function teamCupRecord(action, token = partyCardToken()) {
  if (
    !partyStage('teamcup', 'active') ||
    state.mode === 'trivia' ||
    !['correct', 'skip', 'violation'].includes(action)
  )
    return;
  if (token !== undefined && String(token) !== String(state.cardToken)) return;
  if (token !== undefined && window.event?.detail > 1) return;
  if (state.hiddenCard) return;
  if (!partySeconds()) return teamCupEndTurn();
  if (action === 'violation' && state.mode !== 'taboo') return;
  const s = state;
  s.turnLog.push({
    action,
    word: s.mode === 'mime' ? s.card : s.card[0],
    card: s.card,
    deck: [...s.decks[s.mode]],
    index: s.deckIndex[s.mode],
    score: s.turnScore,
    correct: s.correct,
    skips: s.skips,
    violations: s.violations,
    boostUsed: s.boostUsed,
    boostActive: s.boostActive,
    boosted: s.boostActive,
  });
  const multiplier = s.boostActive ? 2 : 1;
  if (action === 'correct') {
    s.correct++;
    s.turnScore += 10 * multiplier;
    tone();
  } else if (action === 'skip') {
